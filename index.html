<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Base Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    * {
      border-radius: 0px !important;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #181818;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: 'JetBrains Mono', monospace;
      color: #f3f3f3;
    }
    .mc-font {
      font-family: 'Silkscreen', monospace;
    }
    .mc-pixel {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .mc-panel {
      background-color: #262626;
      border: 2px solid #0e0e0e;
      box-shadow:
        inset 2px 2px 0px #3d3d3d,
        inset -2px -2px 0px #171717;
    }
    .mc-slot {
      background-color: #161616;
      border-top: 2px solid #0a0a0a;
      border-left: 2px solid #0a0a0a;
      border-right: 2px solid #3b3b3b;
      border-bottom: 2px solid #3b3b3b;
    }
    .mc-slot:hover {
      background-color: #1f1f1f;
    }
    .mc-btn {
      background-color: #3a3a3a;
      color: #f0f0f0;
      border: 2px solid #0e0e0e;
      box-shadow:
        inset 2px 2px 0px #565656,
        inset -2px -2px 0px #222222;
      transition: background-color 0.08s;
    }
    .mc-btn:hover {
      background-color: #4a4a4a;
    }
    .mc-btn:active {
      box-shadow: inset 2px 2px 0px #1e1e1e;
    }
    .mc-btn-green {
      background-color: #3c8527;
      color: #ffffff;
      border: 2px solid #0d1c08;
      box-shadow:
        inset 2px 2px 0px #57ad3e,
        inset -2px -2px 0px #255716;
      text-shadow: 1px 1px 0px #17380e;
    }
    .mc-btn-green:hover {
      background-color: #469c2e;
    }
    .mc-btn-green:active {
      box-shadow: inset 2px 2px 0px #214d14;
    }
    .mc-xp-track {
      background-color: #131f10;
      border: 2px solid #0a0a0a;
    }
    .mc-xp-fill {
      background-color: #80ff20;
      box-shadow: inset 0 -2px 0 #4ba60f;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen w-full selection:bg-[#80ff20] selection:text-black">

  <!-- BARRE SUPÉRIEURE PLEINE LARGEUR -->
  <header class="mc-panel w-full px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-3.5 h-3.5 bg-[#80ff20] border border-black shrink-0"></div>
      <div>
        <h1 id="currentProjectTitle" class="mc-font text-lg sm:text-xl text-white leading-none">Base Principale</h1>
        <p id="globalStatsText" class="text-xs text-neutral-400 mt-1">0 / 0 validés · 0%</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <span id="saveIndicator" class="text-[#80ff20] text-xs mr-2">✓ Sauvegardé</span>

      <select id="projectSelect" class="mc-slot px-3 py-1.5 text-xs sm:text-sm text-white focus:outline-none"></select>
      <button id="btnNewProject" onclick="createNewProject()" class="mc-btn-green mc-font text-xs px-3 py-2 cursor-pointer">+ Projet</button>
      <button id="btnDelProject" onclick="deleteCurrentProject()" class="mc-btn text-xs px-2.5 py-2 text-neutral-300 hover:text-red-400 cursor-pointer">Suppr.</button>

      <!-- Switch FR / EN -->
      <div class="flex border-2 border-[#0e0e0e] ml-1">
        <button id="langBtnFr" onclick="setLanguage('fr')" class="mc-font text-xs px-2.5 py-1.5 cursor-pointer">FR</button>
        <button id="langBtnEn" onclick="setLanguage('en')" class="mc-font text-xs px-2.5 py-1.5 cursor-pointer">EN</button>
      </div>
    </div>
  </header>

  <!-- BARRE D'XP GLOBALE -->
  <div class="mc-xp-track w-full h-3">
    <div id="globalProgressBar" class="mc-xp-fill h-full transition-all duration-300" style="width: 0%"></div>
  </div>

  <!-- CONTENU PRINCIPAL PLEINE PAGE -->
  <main class="flex-1 w-full p-4 sm:p-6 space-y-5">

    <!-- ZONE IMPORT MULTI-CAPTURES & AJOUT RAPIDE -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

      <!-- Import captures d'écran -->
      <section class="lg:col-span-6 mc-panel flex flex-col justify-between">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4">
          <label id="dropZone" class="flex-1 cursor-pointer">
            <p id="uiDropTitle" class="mc-font text-xs sm:text-sm text-white">Importer des captures d'écran</p>
            <p id="uiDropHint" class="text-xs text-neutral-400 mt-1">1 ou plusieurs images · Glisser-déposer ou Ctrl+V</p>
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)" />

            <select id="columnModeSelect" title="Colonnes sur l'image" class="mc-slot px-2 py-2 text-xs text-neutral-200 focus:outline-none">
              <option value="auto">Auto</option>
              <option value="2">2 Col.</option>
              <option value="1">1 Col.</option>
            </select>
            <button type="button" onclick="openTextImportOnly()" id="uiTextModeBtn" class="mc-btn text-xs px-2.5 py-2 cursor-pointer">Texte</button>
            <label for="imageInput" id="uiBrowseBtn" class="mc-btn-green mc-font text-xs px-3 py-2 cursor-pointer">Images</label>
          </div>
        </div>

        <!-- Progression OCR -->

          <div class="flex justify-between text-xs">
            <span id="ocrStatusLabel" class="text-[#80ff20]">Analyse...</span>
            <span id="ocrPercent" class="text-neutral-300">0%</span>
          </div>
          <div class="mc-xp-track w-full h-2">

    function normalizeStr(str) {
      return String(str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function minecraftEditDistance(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;

      const canon = (s) => s
        .replace(/rt/g, 'rr')
        .replace(/rn/g, 'm')
        .replace(/cl/g, 'd')
        .replace(/vv/g, 'w');

      const ca = canon(a);
      const cb = canon(b);
      if (ca === cb) return 0.25;

      const matrix = Array.from({ length: cb.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= ca.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= cb.length; i++) {
        for (let j = 1; j <= ca.length; j++) {
          const chA = ca[j - 1];
          const chB = cb[i - 1];
          let cost = chA === chB ? 0 : 1;
          if (cost === 1) {
            const pair = chA + chB;
            if (['hw', 'wh', 'li', 'il', 'lt', 'tl', 'eo', 'oe', 'oc', 'co'].includes(pair)) {
              cost = 0.4;
            }
          }
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[cb.length][ca.length];
    }

    function extractEntriesFromPayload(raw) {
      if (!raw) return [];
      if (Array.isArray(raw)) return raw;
      if (Array.isArray(raw.data)) return raw.data;
      if (Array.isArray(raw.icons)) return raw.icons;
      if (Array.isArray(raw.items)) return raw.items;

      const collected = [];
      for (const val of Object.values(raw)) {
        if (Array.isArray(val)) collected.push(...val);
        else if (val && typeof val === 'object') {
          for (const subVal of Object.values(val)) {
            if (Array.isArray(subVal)) collected.push(...subVal);
          }
        }
      }
      return collected;
    }

    // Gère proprement tous les formats de chemins Webisso (/minecraft-item-icons/..., /thumbnails/..., thumbnails/...)
    function resolveWebissoUrl(pathOrUrl) {
      if (!pathOrUrl) return '';
      const str = String(pathOrUrl).trim();
      if (/^https?:\/\//i.test(str)) return str;
      if (str.startsWith('/minecraft-item-icons/')) {
        return `${WEBISSO_ORIGIN}${str}`;
      }
      const cleanPath = str.replace(/^\/+/, '');
      return `${WEBISSO_BASE}/${cleanPath}`;
    }

    // --- Chargement API Webisso v1 (/api/v1/icons.json) ---
    async function loadMinecraftTextures() {
      catalogState = 'loading';
      render();

      const catalogMap = new Map();
      let webissoCount = 0;

      // Essaie d'abord l'endpoint officiel REST v1 statique, puis api.json en repli
      const endpoints = [
        `${WEBISSO_BASE}/api/v1/icons.json`,
        `${WEBISSO_BASE}/api.json`
      ];

      for (const endpoint of endpoints) {
        if (webissoCount > 0) break;
        try {
          const res = await fetch(endpoint, { cache: 'no-cache' });
          if (!res.ok) continue;
          const raw = await res.json();
          const entries = extractEntriesFromPayload(raw);

          // Priorité aux Blocs (20-blocks) et Items (10-items) avant particules/UI
          const categoryPriority = (catSlug = '') => {
            const c = String(catSlug).toLowerCase();
            if (c.includes('block')) return 0;
            if (c.includes('item')) return 1;
            if (c.includes('weapon')) return 2;
            if (c.includes('particle') || c.includes('interface') || c.includes('gui')) return 9;
            return 5;
          };

          entries.sort((a, b) =>
            categoryPriority(a?.category_slug || a?.category) - categoryPriority(b?.category_slug || b?.category)
          );

          for (const entry of entries) {
            if (!entry || typeof entry !== 'object') continue;

            const rawLabel = entry.name || entry.label || entry.title || entry.file || entry.file_slug || '';
            const baseName = String(rawLabel)
              .replace(/\.(png|webp|gif|jpg|jpeg)$/i, '')
              .replace(/[_-]+/g, ' ')
              .trim();

            const norm = normalizeStr(baseName);
            const cleanId = norm.replace(/\s+/g, '_');
            if (!cleanId) continue;

            let iconUrl = resolveWebissoUrl(entry.thumbnail || entry.thumb || entry.thumbnail_url || '');
            let fallbackUrl = resolveWebissoUrl(entry.asset || entry.url || entry.asset_url || '');

            if ((!iconUrl || !fallbackUrl) && entry.category_slug && (entry.file_slug || entry.file)) {
              const rawSlug = String(entry.file_slug || entry.file).replace(/^\/+/, '');
              const fileWithExt = /\.(png|webp|gif|jpg|jpeg)$/i.test(rawSlug) ? rawSlug : `${rawSlug}.png`;
              const subClean = entry.subcategory_slug
                ? `${String(entry.subcategory_slug).replace(/^\/+|\/+$/g, '')}/`
                : '';
              const catClean = String(entry.category_slug).replace(/^\/+|\/+$/g, '');

              if (!iconUrl) {
                iconUrl = `${WEBISSO_BASE}/thumbnails/${catClean}/${subClean}${fileWithExt}`;
              }
              if (!fallbackUrl) {
                fallbackUrl = `${WEBISSO_BASE}/assets/${catClean}/${subClean}${fileWithExt}`;
              }
            }

            if (!iconUrl && fallbackUrl) iconUrl = fallbackUrl;
            if (!iconUrl) continue;

            // Conserve la première occurrence (la plus prioritaire : 20-blocks ou 10-items)
            if (!catalogMap.has(cleanId)) {
              const prettyName = baseName.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
              catalogMap.set(cleanId, {
                id: cleanId,
                readable: prettyName,
                normReadable: norm,
                category: entry.category_slug || '',
                iconUrl,
                fallbackUrl,
                backupUrl: ''
              });
              webissoCount++;
            }
          }
        } catch (err) {
          console.warn('Webisso endpoint warning:', endpoint, err);
        }
      }

      // Catalogue de secours CDN uniquement si une icône précise est absente
      try {
        const res3d = await fetch('https://cdn.jsdelivr.net/npm/minecraft-icon-items@0.4.5/data/itemsByName.json');
        if (res3d.ok) {
          const data3d = await res3d.json();
          for (const item of Object.values(data3d)) {
            if (!item?.name || !item?.icon) continue;
            const norm = normalizeStr(item.name);
            const cleanId = norm.replace(/\s+/g, '_');
            const dataUri = `data:image/png;base64,${item.icon}`;

            if (catalogMap.has(cleanId)) {
              catalogMap.get(cleanId).backupUrl = dataUri;
            } else {
              catalogMap.set(cleanId, {
                id: cleanId,
                readable: item.name,
                normReadable: norm,
                category: 'cdn',
                iconUrl: dataUri,
                fallbackUrl: '',
                backupUrl: ''
              });
            }
          }
        }
      } catch {}

      mcCatalog = Array.from(catalogMap.values());
      mcCatalogById = {};
      for (const item of mcCatalog) {
        mcCatalogById[item.id] = item;
      }

      catalogSourceLabel = webissoCount > 0 ? 'Webisso' : 'CDN';
      catalogState = mcCatalog.length > 0 ? 'loaded' : 'offline';

      // Actualise automatiquement les icônes de tous les projets enregistrés
      let updated = false;
      for (const proj of state.projects) {
        for (const item of proj.items) {
          const match = resolveMinecraftItem(item.name);
          if (match) {
            item.iconUrl = match.iconUrl;
            item.fallbackUrl = match.fallbackUrl;
            item.backupUrl = match.backupUrl;
            updated = true;
          }
        }
      }
      if (updated) saveState();
      else render();
    }

    function resolveMinecraftItem(rawName) {
      if (!mcCatalog.length || !rawName) return null;
      const norm = normalizeStr(rawName);
      if (!norm) return null;

      // 1. Alias FR exact
      if (FR_ALIASES[norm] && mcCatalogById[FR_ALIASES[norm]]) {
        return mcCatalogById[FR_ALIASES[norm]];
      }

      // 2. Correspondance exacte ID ou nom lisible
      const asId = norm.replace(/\s+/g, '_');
      if (mcCatalogById[asId]) return mcCatalogById[asId];

      const exactReadable = mcCatalog.find(i => i.normReadable === norm);
      if (exactReadable) return exactReadable;

      // 3. Correction fautes de frappe OCR (même nombre de mots)
      const inputWords = norm.split(' ');
      if (norm.length >= 4) {
        let bestMatch = null;
        let bestDist = norm.length >= 10 ? 2.2 : 1.3;

        for (const item of mcCatalog) {
          const itemWords = item.normReadable.split(' ');
          if (itemWords.length !== inputWords.length) continue;
          if (Math.abs(item.normReadable.length - norm.length) > 2) continue;

          const d = minecraftEditDistance(norm, item.normReadable);
          if (d <= bestDist) {
            bestDist = d;
            bestMatch = item;
            if (d === 0) break;
          }
        }
        if (bestMatch) return bestMatch;
      }

      // 4. Recherche de variantes multi-mots (ex: "barrel" -> "Barrel Closed", "campfire" -> "Lit Campfire")
      const secondaryWords = new Set(['open', 'unlit', 'off', 'top', 'bottom', 'side', 'front', 'back', 'empty', 'broken', 'inside', 'particle']);
      const variantCandidates = mcCatalog.filter(item => {
        const wList = item.normReadable.split(' ');
        return inputWords.every(w => wList.includes(w));
      });

      if (variantCandidates.length > 0) {
        variantCandidates.sort((a, b) => {
          const aWords = a.normReadable.split(' ');
          const bWords = b.normReadable.split(' ');
          const aPenalty = aWords.some(w => secondaryWords.has(w)) ? 100 : 0;
          const bPenalty = bWords.some(w => secondaryWords.has(w)) ? 100 : 0;
          return (aPenalty + a.normReadable.length) - (bPenalty + b.normReadable.length);
        });
        const bestVariant = variantCandidates[0];
        const titleCased = norm.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        return {
          id: bestVariant.id,
          readable: titleCased,
          normReadable: norm,
          iconUrl: bestVariant.iconUrl,
          fallbackUrl: bestVariant.fallbackUrl,
          backupUrl: bestVariant.backupUrl
        };
      }

      return null;
    }

    function searchMinecraftCatalog(query, limit = 30) {
      const norm = normalizeStr(query);
      if (!norm || !mcCatalog.length) return [];

      const results = [];
      const seen = new Set();

      for (const [frKey, mcId] of Object.entries(FR_ALIASES)) {
        if (frKey.includes(norm) && mcCatalogById[mcId] && !seen.has(mcId)) {
          seen.add(mcId);
          results.push(mcCatalogById[mcId]);
          if (results.length >= limit) return results;
        }
      }

      const asId = norm.replace(/\s+/g, '_');
      for (const item of mcCatalog) {
        if (seen.has(item.id)) continue;
        if (item.normReadable.includes(norm) || item.id.includes(asId)) {
          seen.add(item.id);
          results.push(item);
          if (results.length >= limit) break;
        }
      }
      return results;
    }

    function handleIconError(imgEl) {
      const step = parseInt(imgEl.dataset.step || '0', 10);
      const fb1 = imgEl.dataset.fb1;
      const fb2 = imgEl.dataset.fb2;

      if (step === 0 && fb1 && imgEl.src !== fb1) {
        imgEl.dataset.step = '1';
        imgEl.src = fb1;
        return;
      }
      if (step <= 1 && fb2 && imgEl.src !== fb2) {
        imgEl.dataset.step = '2';
        imgEl.src = fb2;
        return;
      }
      const span = document.createElement('span');
      span.className = 'text-xs text-neutral-600';
      span.textContent = '?';
      imgEl.replaceWith(span);
    }

    function renderIconImg(iconUrl, fallbackUrl = '', backupUrl = '', sizeClass = 'w-8 h-8') {
      if (!iconUrl && !fallbackUrl && !backupUrl) {
        return `<span class="text-xs text-neutral-600">?</span>`;
      }
      const primary = iconUrl || fallbackUrl || backupUrl;
      return `<img src="${escapeHtml(primary)}"
        data-step="0"
        data-fb1="${escapeHtml(fallbackUrl || '')}"
        data-fb2="${escapeHtml(backupUrl || '')}"
        alt=""
        loading="lazy"
        class="${sizeClass} mc-pixel object-contain"
        onerror="handleIconError(this)" />`;
    }

    // --- État & Sauvegarde (avec migration automatique des versions précédentes) ---
    function loadState() {
      const keysToTry = [STORAGE_KEY, 'mc_base_tracker_v8', 'mc_base_tracker_v7', 'mc_base_tracker_v6'];
      for (const key of keysToTry) {
        const saved = localStorage.getItem(key);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.lang) parsed.lang = 'fr';
            return parsed;
          } catch {}
        }
      }
      return {
        lang: 'fr',
        activeProjectId: 'default',
        projects: [{ id: 'default', name: 'Base Principale', items: [] }]
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      flashSaveIndicator();
      render();
    }

    function flashSaveIndicator() {
      const el = document.getElementById('saveIndicator');
      if (!el) return;
      el.textContent = t().saved;
      el.classList.remove('opacity-50');
      clearTimeout(window._saveTimer);
      window._saveTimer = setTimeout(() => el.classList.add('opacity-50'), 1500);
    }

    function getActiveProject() {
      return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // --- Projets ---
    function createNewProject() {
      const name = prompt(t().promptProject);
      if (!name || !name.trim()) return;
      const id = 'proj_' + Date.now();
      state.projects.push({ id, name: name.trim(), items: [] });
      state.activeProjectId = id;
      saveState();
    }

    function deleteCurrentProject() {
      if (state.projects.length <= 1) {
        alert(t().alertLastProject);
        return;
      }
      const proj = getActiveProject();
      if (!confirm(t().confirmDelete(proj.name))) return;
      state.projects = state.projects.filter(p => p.id !== proj.id);
      state.activeProjectId = state.projects[0].id;
      saveState();
    }

    document.getElementById('projectSelect').addEventListener('change', (e) => {
      state.activeProjectId = e.target.value;
      saveState();
    });

    // --- Autocomplétion ---
    function onManualNameInput(val) {
      const dropdown = document.getElementById('autocompleteDropdown');
      const previewBox = document.getElementById('manualPreviewBox');

      const directMatch = resolveMinecraftItem(val);
      selectedManualMatch = directMatch || null;
      previewBox.innerHTML = directMatch
        ? renderIconImg(directMatch.iconUrl, directMatch.fallbackUrl, directMatch.backupUrl, 'w-6 h-6')
        : `<span class="text-xs text-neutral-600">?</span>`;

      const suggestions = searchMinecraftCatalog(val, 15);
      if (!suggestions.length) {
        dropdown.classList.add('hidden');
        return;
      }

      dropdown.classList.remove('hidden');
      dropdown.innerHTML = suggestions.map(s => `
        <button type="button" onclick="selectAutocompleteItemById('${escapeHtml(s.id)}')"
          class="w-full flex items-center justify-between px-3 py-2 text-left text-xs hover:bg-[#2a2a2a] transition cursor-pointer">
          <div class="flex items-center gap-3">
            ${renderIconImg(s.iconUrl, s.fallbackUrl, s.backupUrl, 'w-6 h-6')}
            <span class="text-white">${escapeHtml(s.readable)}</span>
          </div>
          <span class="text-neutral-500">${escapeHtml(s.category || s.id)}</span>
        </button>
      `).join('');
    }

    function selectAutocompleteItemById(id) {
      const entry = mcCatalogById[id];
      if (!entry) return;
      document.getElementById('manualName').value = entry.readable;
      selectedManualMatch = entry;
      document.getElementById('manualPreviewBox').innerHTML = renderIconImg(entry.iconUrl, entry.fallbackUrl, entry.backupUrl, 'w-6 h-6');
      document.getElementById('autocompleteDropdown').classList.add('hidden');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#manualName') && !e.target.closest('#autocompleteDropdown')) {
        document.getElementById('autocompleteDropdown').classList.add('hidden');
      }
    });

    // --- Matériaux ---
    function addManualItem(e) {
      e.preventDefault();
      const name = document.getElementById('manualName').value.trim();
      const have = parseInt(document.getElementById('manualHave').value, 10) || 0;
      const need = parseInt(document.getElementById('manualNeed').value, 10) || 1;
      if (!name) return;

      const resolved = selectedManualMatch || resolveMinecraftItem(name);
      upsertMaterial(name, have, need, resolved?.iconUrl || '', resolved?.fallbackUrl || '', resolved?.backupUrl || '');

      e.target.reset();
      selectedManualMatch = null;
      document.getElementById('manualPreviewBox').innerHTML = `<span class="text-xs text-neutral-600">?</span>`;
      document.getElementById('autocompleteDropdown').classList.add('hidden');
      saveState();
    }

    function upsertMaterial(name, have, need, iconUrl = '', fallbackUrl = '', backupUrl = '') {
      const proj = getActiveProject();
      const existing = proj.items.find(i => normalizeStr(i.name) === normalizeStr(name));
      if (existing) {
        existing.need += need;
        existing.have += have;
        if (!existing.iconUrl && iconUrl) {
          existing.iconUrl = iconUrl;
          existing.fallbackUrl = fallbackUrl;
          existing.backupUrl = backupUrl;
        }
      } else {
        const autoMatch = iconUrl ? { iconUrl, fallbackUrl, backupUrl } : resolveMinecraftItem(name);
        proj.items.push({
          id: 'item_' + Date.now() + Math.random(),
          name: autoMatch?.readable || name,
          have,
          need,
          iconUrl: autoMatch?.iconUrl || '',
          fallbackUrl: autoMatch?.fallbackUrl || '',
          backupUrl: autoMatch?.backupUrl || ''
        });
      }
    }

    function incrementItem(id, delta) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = Math.max(0, item.have + delta);
      saveState();
    }

    function setItemHave(id, value) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = Math.max(0, parseInt(value, 10) || 0);
      saveState();
    }

    function editItemNeed(id) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      const val = prompt(`${item.name} — Requis :`, item.need);
      const parsed = parseInt(val, 10);
      if (!isNaN(parsed) && parsed > 0) {
        item.need = parsed;
        saveState();
      }
    }

    function completeItem(id) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = item.need;
      saveState();
    }

    function removeItem(id) {
      const proj = getActiveProject();
      proj.items = proj.items.filter(i => i.id !== id);
      saveState();
    }

    function toggleIconPicker(id) {
      activeIconPickerId = activeIconPickerId === id ? null : id;
      render();
      if (activeIconPickerId) {
        const proj = getActiveProject();
        const item = proj.items.find(i => i.id === activeIconPickerId);
        if (item) searchIconForItem(activeIconPickerId, item.name);
      }
    }

    function searchIconForItem(itemId, query) {
      const container = document.getElementById(`pickerResults_${itemId}`);
      if (!container) return;
      const results = searchMinecraftCatalog(query, 30);
      container.innerHTML = results.map(r => `
        <button type="button" onclick="applyIconToItemById('${itemId}', '${escapeHtml(r.id)}')"
          title="${escapeHtml(r.readable)} (${escapeHtml(r.category)})"
          class="w-9 h-9 mc-slot flex items-center justify-center cursor-pointer">
          ${renderIconImg(r.iconUrl, r.fallbackUrl, r.backupUrl, 'w-6 h-6')}
        </button>
      `).join('');
    }

    function applyIconToItemById(itemId, catalogId) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === itemId);
      const entry = mcCatalogById[catalogId];
      if (item && entry) {
        item.iconUrl = entry.iconUrl;
        item.fallbackUrl = entry.fallbackUrl;
        item.backupUrl = entry.backupUrl;
      }
      activeIconPickerId = null;
      saveState();
    }

    // =========================================================================
    // OCR SPÉCIALISÉ MINECRAFT : ISOLATION TEXTE + DÉCOUPE LIGNES + DOUBLE PASSE
    // =========================================================================

    function prepareCleanWhiteBgCanvas(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);

          const origW = img.width;
          const origH = img.height;

          const rawCanvas = document.createElement('canvas');
          rawCanvas.width = origW;
          rawCanvas.height = origH;
          const rawCtx = rawCanvas.getContext('2d');
          rawCtx.drawImage(img, 0, 0);

          const imgData = rawCtx.getImageData(0, 0, origW, origH);
          const data = imgData.data;

          let sumLum = 0;
          for (let i = 0; i < data.length; i += 16) {
            sumLum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          }
          const isDarkTheme = (sumLum / (data.length / 16)) < 140;

          for (let i = 0; i < data.length; i += 4) {
            const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            let out;
            if (isDarkTheme) {
              if (lum <= 140) out = 255;
              else if (lum >= 205) out = 0;
              else out = Math.round(255 - ((lum - 140) / 65) * 255);
            } else {
              if (lum >= 180) out = 255;
              else if (lum <= 105) out = 0;
              else out = Math.round(((lum - 105) / 75) * 255);
            }
            data[i] = data[i + 1] = data[i + 2] = out;
            data[i + 3] = 255;
          }
          rawCtx.putImageData(imgData, 0, 0);

          const scale = origW < 1300 ? 3 : 2;
          const scaledCanvas = document.createElement('canvas');
          scaledCanvas.width = origW * scale;
          scaledCanvas.height = origH * scale;
          const sCtx = scaledCanvas.getContext('2d');
          sCtx.imageSmoothingEnabled = true;
          sCtx.imageSmoothingQuality = 'high';
          sCtx.drawImage(rawCanvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

          resolve(scaledCanvas);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        img.src = url;
      });
    }

    function cropCanvasRect(src, x0, y0, x1, y1, pad = 6) {
      const sx = Math.max(0, Math.floor(x0));
      const sy = Math.max(0, Math.floor(y0));
      const sw = Math.max(1, Math.min(src.width - sx, Math.ceil(x1 - sx)));
      const sh = Math.max(1, Math.min(src.height - sy, Math.ceil(y1 - sy)));

      const out = document.createElement('canvas');
      out.width = sw + pad * 2;
      out.height = sh + pad * 2;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(src, sx, sy, sw, sh, pad, pad, sw, sh);
      return out;
    }

    function splitCanvasIntoColumns(canvas) {
      const mode = document.getElementById('columnModeSelect').value;
      const w = canvas.width;
      const h = canvas.height;

      if (mode === '1') return [canvas];
      if (mode === '2') {
        return [
          cropCanvasRect(canvas, 0, 0, w / 2, h, 0),
          cropCanvasRect(canvas, w / 2, 0, w, h, 0)
        ];
      }

      const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
      const yStart = Math.floor(h * 0.04);
      const yEnd = Math.floor(h * 0.96);

      const darkInCol = (x) => {
        let count = 0;
        for (let y = yStart; y < yEnd; y += 2) {
          if (data[(y * w + x) * 4] < 160) count++;
        }
        return count;
      };

      let leftDark = 0;
      for (let x = Math.floor(w * 0.14); x < Math.floor(w * 0.36); x += 4) leftDark += darkInCol(x);
      let rightDark = 0;
      for (let x = Math.floor(w * 0.64); x < Math.floor(w * 0.86); x += 4) rightDark += darkInCol(x);

      if (leftDark < 30 || rightDark < 30) return [canvas];

      let bestStart = -1, bestLen = 0, currStart = -1, currLen = 0;
      for (let x = Math.floor(w * 0.43); x <= Math.floor(w * 0.57); x++) {
        if (darkInCol(x) === 0) {
          if (currStart === -1) currStart = x;
          currLen++;
          if (currLen > bestLen) {
            bestLen = currLen;
            bestStart = currStart;
          }
        } else {
          currStart = -1;
          currLen = 0;
        }
      }

      if (bestLen >= 6) {
        const midX = bestStart + Math.floor(bestLen / 2);
        return [
          cropCanvasRect(canvas, 0, 0, midX, h, 0),
          cropCanvasRect(canvas, midX, 0, w, h, 0)
        ];
      }
      return [canvas];
    }

    function analyzeColumnLayout(colCanvas) {
      const w = colCanvas.width;
      const h = colCanvas.height;
      const data = colCanvas.getContext('2d').getImageData(0, 0, w, h).data;

      const iconCutoffX = Math.floor(w * 0.125);
      const colProj = new Int32Array(w);
      for (let y = 0; y < h; y++) {
        for (let x = iconCutoffX; x < w; x++) {
          if (data[(y * w + x) * 4] < 165) colProj[x]++;
        }
      }

      let splitNumX = -1;
      let bestGapLen = 0;
      let currGapStart = -1;
      let currGapLen = 0;

      for (let x = Math.floor(w * 0.58); x <= Math.floor(w * 0.86); x++) {
        if (colProj[x] <= 1) {
          if (currGapStart === -1) currGapStart = x;
          currGapLen++;
          if (currGapLen > bestGapLen) {
            bestGapLen = currGapLen;
            splitNumX = currGapStart + Math.floor(currGapLen / 2);
          }
        } else {
          currGapStart = -1;
          currGapLen = 0;
        }
      }

      let hasRightNumbers = false;
      if (splitNumX !== -1 && bestGapLen >= Math.max(8, Math.floor(w * 0.025))) {
        let rightInk = 0;
        for (let x = splitNumX + 2; x < w - 4; x++) rightInk += colProj[x];
        if (rightInk > 25) hasRightNumbers = true;
      }

      const rowProj = new Int32Array(h);
      for (let y = 0; y < h; y++) {
        let ink = 0;
        for (let x = iconCutoffX; x < w; x++) {
          if (data[(y * w + x) * 4] < 165) ink++;
        }
        rowProj[y] = ink;
      }

      const rows = [];
      let inRow = false;
      let rStart = 0;
      for (let y = 0; y < h; y++) {
        if (rowProj[y] >= 4) {
          if (!inRow) {
            inRow = true;
            rStart = y;
          }
        } else if (inRow) {
          if (y - rStart >= 8) {
            rows.push({ y0: rStart, y1: y });
          }
          inRow = false;
        }
      }
      if (inRow && h - rStart >= 8) rows.push({ y0: rStart, y1: h });

      return { iconCutoffX, splitNumX: hasRightNumbers ? splitNumX : -1, rows };
    }

    function fixMinecraftOcrTypos(name) {
      return name
        .replace(/\bHood\b/gi, 'Wood')
        .replace(/\bHall\b/gi, 'Wall')
        .replace(/\bStab\b/gi, 'Slab')
        .replace(/\bBartel\b/gi, 'Barrel')
        .replace(/\bCamplire\b/gi, 'Campfire')
        .replace(/\b0ak\b/gi, 'Oak')
        .replace(/\b1og\b/gi, 'Log')
        .replace(/\b1ron\b/gi, 'Iron')
        .replace(/\b8rick/gi, 'Brick')
        .replace(/\bFurnaco\b/gi, 'Furnace')
        .replace(/\bStalrs\b/gi, 'Stairs')
        .replace(/\bTrapd00r\b/gi, 'Trapdoor')
        .replace(/\bP0lished\b/gi, 'Polished')
        .replace(/\bAndeslte\b/gi, 'Andesite')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function cleanItemLabel(raw) {
      let cleaned = String(raw || '')
        .replace(/^[^a-zA-ZÀ-ÿ]+/, '')
        .replace(/[^a-zA-ZÀ-ÿ)]+$/, '')
        .replace(/\s+/g, ' ')
        .trim();

      cleaned = cleaned.replace(/^[a-zA-Z]{1,2}\s+(?=[A-ZÀ-Ý])/, '').trim();
      if (!/[a-zA-ZÀ-ÿ]{3,}/.test(cleaned)) return '';

      cleaned = fixMinecraftOcrTypos(cleaned);
      const match = resolveMinecraftItem(cleaned);
      return match ? match.readable : cleaned;
    }

    function parseTextBlockToItems(text) {
      const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
      const results = [];

      for (let line of lines) {
        line = line.replace(/^[^a-zA-ZÀ-ÿ0-9]+/, '').trim();
        if (!line || !/[a-zA-ZÀ-ÿ]{3,}/.test(line)) continue;

        if (/^(item|material|total|missing|available|materiau|requis|manquant)\b/i.test(line) && !/\d/.test(line)) {
          continue;
        }

        const fracMatch = line.match(/^(.+?)\s*(?:[:\-])?\s*(\d+)\s*\/\s*(\d+)$/);
        if (fracMatch) {
          const name = cleanItemLabel(fracMatch[1]);
          const have = parseInt(fracMatch[2], 10);
          const need = parseInt(fracMatch[3], 10);
          if (name && need > 0) {
            const match = resolveMinecraftItem(name);
            results.push({ name, have, need, iconUrl: match?.iconUrl || '', fallbackUrl: match?.fallbackUrl || '', backupUrl: match?.backupUrl || '' });
            continue;
          }
        }

        const prefixMatch = line.match(/^[xX×]?\s*(\d+)\s*[xX×]?\s+([a-zA-ZÀ-ÿ].+)$/);
        if (prefixMatch) {
          const need = parseInt(prefixMatch[1], 10);
          const name = cleanItemLabel(prefixMatch[2]);
          if (name && need > 0) {
            const match = resolveMinecraftItem(name);
            results.push({ name, have: 0, need, iconUrl: match?.iconUrl || '', fallbackUrl: match?.fallbackUrl || '', backupUrl: match?.backupUrl || '' });
            continue;
          }
        }

        const tokens = line.split(/\s+/);
        if (tokens.length >= 2) {
          const lastToken = tokens[tokens.length - 1].replace(/^[xX×:]+/, '');
          if (/^\d+$/.test(lastToken)) {
            const need = parseInt(lastToken, 10);
            const rawName = tokens.slice(0, -1).join(' ').replace(/[:\-xX×]+$/, '').trim();
            const name = cleanItemLabel(rawName);
            if (name && need > 0) {
              const match = resolveMinecraftItem(name);
              results.push({ name, have: 0, need, iconUrl: match?.iconUrl || '', fallbackUrl: match?.fallbackUrl || '', backupUrl: match?.backupUrl || '' });
              continue;
            }
          }
        }
      }

      return results;
    }

    function openTextImportOnly() {
      document.getElementById('ocrReviewBox').classList.remove('hidden');
      const area = document.getElementById('ocrRawTextArea');
      area.focus();
      reparseFromTextArea();
    }

    function reparseFromTextArea() {
      const rawText = document.getElementById('ocrRawTextArea').value;
      const extracted = parseTextBlockToItems(rawText);

      const merged = new Map();
      for (const item of extracted) {
        const key = normalizeStr(item.name);
        if (merged.has(key)) {
          const prev = merged.get(key);
          prev.have += item.have;
          prev.need += item.need;
        } else {
          merged.set(key, { ...item });
        }
      }
      parsedOcrItems = Array.from(merged.values());
      renderOcrReview();
    }

    function handleImageUpload(e) {
      const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
      if (files.length) runBatchOCR(files);
      e.target.value = '';
    }

    window.addEventListener('paste', (e) => {
      if (document.activeElement?.id === 'ocrRawTextArea') return;
      const items = e.clipboardData?.items;
      if (!items) return;
      const files = [];
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) files.push(file);
        }
      }
      if (files.length) runBatchOCR(files);
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.parentElement.parentElement.classList.add('bg-[#2e2e2e]'); });
    dropZone.addEventListener('dragleave', () => dropZone.parentElement.parentElement.classList.remove('bg-[#2e2e2e]'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.parentElement.parentElement.classList.remove('bg-[#2e2e2e]');
      const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
      if (files.length) runBatchOCR(files);
    });

    async function runBatchOCR(imageFiles) {
      const statusBox = document.getElementById('ocrStatus');
      const statusLabel = document.getElementById('ocrStatusLabel');
      const percentLabel = document.getElementById('ocrPercent');
      const progressBar = document.getElementById('ocrProgressBar');

      statusBox.classList.remove('hidden');
      statusLabel.textContent = t().ocrInit;
      percentLabel.textContent = '0%';
      progressBar.style.width = '0%';

      const totalFiles = imageFiles.length;

      try {
        const worker = await Tesseract.createWorker(['eng', 'fra'], 1);
        const allCleanTextLines = [];

        for (let fIdx = 0; fIdx < totalFiles; fIdx++) {
          const cleanCanvas = await prepareCleanWhiteBgCanvas(imageFiles[fIdx]);
          if (!cleanCanvas) continue;

          const columns = splitCanvasIntoColumns(cleanCanvas);

          for (let cIdx = 0; cIdx < columns.length; cIdx++) {
            const col = columns[cIdx];
            const layout = analyzeColumnLayout(col);

            if (layout.splitNumX !== -1 && layout.rows.length > 0) {
              for (let rIdx = 0; rIdx < layout.rows.length; rIdx++) {
                const row = layout.rows[rIdx];
                const padY = Math.max(4, Math.round((row.y1 - row.y0) * 0.25));
                const y0 = row.y0 - padY;
                const y1 = row.y1 + padY;

                const nameCrop = cropCanvasRect(col, layout.iconCutoffX, y0, layout.splitNumX, y1, 8);
                await worker.setParameters({
                  tessedit_pageseg_mode: '7',
                  tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀ-ÿ '-"
                });
                const nameRes = await worker.recognize(nameCrop);
                const cleanName = cleanItemLabel(nameRes.data.text);

                const numCrop = cropCanvasRect(col, layout.splitNumX, y0, col.width, y1, 8);
                await worker.setParameters({
                  tessedit_pageseg_mode: '7',
                  tessedit_char_whitelist: '0123456789/'
                });
                const numRes = await worker.recognize(numCrop);
                const numStr = (numRes.data.text || '').replace(/\s+/g, '').trim();

                if (cleanName && numStr) {
                  allCleanTextLines.push(`${cleanName} : ${numStr}`);
                }

                const stepPct = Math.round(((rIdx + 1) / layout.rows.length) * 100);
                const overallPct = Math.round(((fIdx + (cIdx + (rIdx + 1) / layout.rows.length) / columns.length) / totalFiles) * 100);
                statusLabel.textContent = t().ocrScanning(fIdx + 1, totalFiles, stepPct);
                percentLabel.textContent = overallPct + '%';
                progressBar.style.width = overallPct + '%';
              }
            } else {
              await worker.setParameters({
                tessedit_pageseg_mode: '6',
                tessedit_char_whitelist: ''
              });
              const { data: { text } } = await worker.recognize(col);
              const items = parseTextBlockToItems(text);
              for (const it of items) {
                allCleanTextLines.push(it.have > 0 ? `${it.name} : ${it.have}/${it.need}` : `${it.name} : ${it.need}`);
              }
            }
          }
        }

        await worker.terminate();
        statusBox.classList.add('hidden');

        const area = document.getElementById('ocrRawTextArea');
        area.value = allCleanTextLines.join('\n');
        document.getElementById('ocrReviewBox').classList.remove('hidden');
        reparseFromTextArea();
      } catch (err) {
        console.error(err);
        statusLabel.textContent = t().ocrError;
      }
    }

    function updateOcrItemName(idx, val) {
      parsedOcrItems[idx].name = val;
      const match = resolveMinecraftItem(val);
      parsedOcrItems[idx].iconUrl = match?.iconUrl || '';
      parsedOcrItems[idx].fallbackUrl = match?.fallbackUrl || '';
      parsedOcrItems[idx].backupUrl = match?.backupUrl || '';
      renderOcrReview();
    }

    function renderOcrReview() {
      const box = document.getElementById('ocrReviewBox');
      const list = document.getElementById('ocrParsedList');
      const countBadge = document.getElementById('ocrCountBadge');
      box.classList.remove('hidden');
      countBadge.textContent = t().reviewCount(parsedOcrItems.length);

      list.innerHTML = parsedOcrItems.map((item, idx) => `
        <div class="grid grid-cols-12 gap-1.5 items-center bg-[#161616] p-1.5 border border-[#2a2a2a]">
          <div class="col-span-6 flex items-center mc-slot">
            <div class="w-8 h-8 flex items-center justify-center border-r border-[#333] shrink-0">
              ${renderIconImg(item.iconUrl, item.fallbackUrl, item.backupUrl, 'w-6 h-6')}
            </div>
            <input type="text" value="${escapeHtml(item.name)}" placeholder="Item"
              onchange="updateOcrItemName(${idx}, this.value)"
              class="w-full bg-transparent px-2 py-1 text-xs text-white focus:outline-none" />
          </div>
          <input type="number" value="${item.have}" min="0" placeholder="0"
            onchange="parsedOcrItems[${idx}].have = parseInt(this.value,10)||0"
            class="col-span-2 mc-slot px-2 py-1 text-xs text-white focus:outline-none" />
          <input type="number" value="${item.need}" min="1" placeholder="1"
            onchange="parsedOcrItems[${idx}].need = parseInt(this.value,10)||1"
            class="col-span-3 mc-slot px-2 py-1 text-xs text-white focus:outline-none" />
          <button onclick="parsedOcrItems.splice(${idx},1); renderOcrReview()" class="col-span-1 text-neutral-500 hover:text-red-400 text-xs cursor-pointer">✕</button>
        </div>
      `).join('');
    }

    function addParsedRow() {
      parsedOcrItems.push({ name: '', have: 0, need: 1, iconUrl: '', fallbackUrl: '', backupUrl: '' });
      renderOcrReview();
    }

    function closeOcrReview() {
      document.getElementById('ocrReviewBox').classList.add('hidden');
      parsedOcrItems = [];
    }

    function confirmOcrItems() {
      for (const item of parsedOcrItems) {
        if (item.name && item.name.trim()) {
          upsertMaterial(item.name.trim(), item.have || 0, item.need || 1, item.iconUrl || '', item.fallbackUrl || '', item.backupUrl || '');
        }
      }
      closeOcrReview();
      saveState();
    }

    // --- Formatage Stacks & Shulkers ---
    function formatStacks(missing) {
      if (missing < 64) return `${missing}`;
      const shulkers = Math.floor(missing / 1728);
      const remAfterShulker = missing % 1728;
      const stacks = Math.floor(remAfterShulker / 64);
      const rest = remAfterShulker % 64;

      const parts = [];
      if (shulkers > 0) parts.push(`${shulkers} shulker${shulkers > 1 ? 's' : ''}`);
      if (stacks > 0) parts.push(`${stacks}×64`);
      if (rest > 0) parts.push(`${rest}`);
      return `${missing} (${parts.join(' + ')})`;
    }

    // --- Rendu ---
    function render() {
      const lang = state.lang || 'fr';
      const dict = t();

      document.getElementById('btnNewProject').textContent = dict.newProject;
      document.getElementById('btnDelProject').textContent = dict.delProject;
      document.getElementById('uiDropTitle').textContent = dict.dropTitle;
      document.getElementById('uiDropHint').textContent = dict.dropHint;
      document.getElementById('uiTextModeBtn').textContent = dict.textModeBtn;
      document.getElementById('uiBrowseBtn').textContent = dict.browseBtn;
      document.getElementById('uiManualTitle').textContent = dict.manualTitle;
      document.getElementById('manualName').placeholder = dict.placeholderName;
      document.getElementById('manualHave').placeholder = dict.placeholderHave;
      document.getElementById('manualNeed').placeholder = dict.placeholderNeed;
      document.getElementById('listSearchInput').placeholder = dict.searchPlaceholder;
      document.getElementById('uiReviewTitle').textContent = dict.reviewTitle;
      document.getElementById('uiStep1Label').textContent = dict.step1Label;
      document.getElementById('uiReparseBtn').textContent = dict.reparseBtn;
      document.getElementById('uiStep2Label').textContent = dict.step2Label;
      document.getElementById('uiCloseReview').textContent = dict.closeReview;
      document.getElementById('uiAddRowBtn').textContent = dict.addRow;
      document.getElementById('uiConfirmOcrBtn').textContent = dict.confirmOcr;
      document.getElementById('uiMaterialsHeader').textContent = dict.materialsHeader;
      document.getElementById('filterAll').textContent = dict.filterAll;
      document.getElementById('filterTodo').textContent = dict.filterTodo;
      document.getElementById('filterDone').textContent = dict.filterDone;

      document.getElementById('langBtnFr').className = `mc-font text-xs px-2.5 py-1.5 cursor-pointer ${lang === 'fr' ? 'bg-[#80ff20] text-black font-bold' : 'bg-[#1a1a1a] text-neutral-400'}`;
      document.getElementById('langBtnEn').className = `mc-font text-xs px-2.5 py-1.5 cursor-pointer ${lang === 'en' ? 'bg-[#80ff20] text-black font-bold' : 'bg-[#1a1a1a] text-neutral-400'}`;

      ['all', 'todo', 'done'].forEach(f => {
        const btn = document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1));
        btn.className = `px-3 py-1.5 border border-[#0e0e0e] cursor-pointer ${currentFilter === f ? 'bg-[#80ff20] text-black font-bold' : 'bg-[#1a1a1a] text-neutral-400 hover:text-white'}`;
      });

      const catEl = document.getElementById('catalogStatus');
      if (catalogState === 'loading') {
        catEl.textContent = dict.texturesLoading;
        catEl.className = 'text-xs text-neutral-400';
      } else if (catalogState === 'loaded') {
        catEl.textContent = dict.texturesLoaded(mcCatalog.length, catalogSourceLabel);
        catEl.className = 'text-xs text-[#80ff20]';
      } else {
        catEl.textContent = dict.texturesOffline;
        catEl.className = 'text-xs text-red-400';
      }

      const select = document.getElementById('projectSelect');
      select.innerHTML = state.projects.map(p =>
        `<option value="${p.id}" ${p.id === state.activeProjectId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
      ).join('');

      const proj = getActiveProject();
      document.getElementById('currentProjectTitle').textContent = proj.name;

      const totalItems = proj.items.length;
      const doneItems = proj.items.filter(i => i.have >= i.need).length;
      const totalHave = proj.items.reduce((acc, i) => acc + Math.min(i.have, i.need), 0);
      const totalNeed = proj.items.reduce((acc, i) => acc + i.need, 0);
      const globalPct = totalNeed > 0 ? Math.round((totalHave / totalNeed) * 100) : 0;

      document.getElementById('globalStatsText').textContent = dict.stats(doneItems, totalItems, globalPct);
      document.getElementById('globalProgressBar').style.width = globalPct + '%';

      const searchTerm = normalizeStr(document.getElementById('listSearchInput').value);

      let visibleItems = [...proj.items];
      if (currentFilter === 'todo') visibleItems = visibleItems.filter(i => i.have < i.need);
      if (currentFilter === 'done') visibleItems = visibleItems.filter(i => i.have >= i.need);
      if (searchTerm) {
        visibleItems = visibleItems.filter(i => normalizeStr(i.name).includes(searchTerm));
      }

      visibleItems.sort((a, b) => (a.have >= a.need ? 1 : 0) - (b.have >= b.need ? 1 : 0));

      const listEl = document.getElementById('materialsList');
      if (visibleItems.length === 0) {
        listEl.innerHTML = `<p class="col-span-full text-xs text-neutral-500 py-10 text-center">${dict.emptyList}</p>`;
        return;
      }

      listEl.innerHTML = visibleItems.map(item => {
        const isValidated = item.have >= item.need;
        const pct = Math.min(100, Math.round((item.have / item.need) * 100));
        const missing = Math.max(0, item.need - item.have);
        const isPickerOpen = activeIconPickerId === item.id;

        return `
          <div class="p-3 border-2 transition ${isValidated ? 'bg-[#172814] border-[#3c8527]' : 'bg-[#1d1d1d] border-[#101010]'} space-y-2.5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              <div class="flex items-center gap-3 min-w-0">
                <button type="button" onclick="toggleIconPicker('${item.id}')"
                  class="w-11 h-11 mc-slot flex items-center justify-center shrink-0 cursor-pointer">
                  ${renderIconImg(item.iconUrl, item.fallbackUrl, item.backupUrl, 'w-8 h-8')}
                </button>

                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="text-sm font-bold truncate ${isValidated ? 'text-[#80ff20]' : 'text-white'}">${escapeHtml(item.name)}</span>
                    ${isValidated
                      ? `<span class="mc-font text-[10px] bg-[#3c8527] text-white px-2 py-0.5 border border-[#0f1f0a]">${dict.validatedBadge}</span>`
                      : `<span class="text-xs text-amber-400">${dict.missingLabel(formatStacks(missing))}</span>`
                    }
                  </div>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-1 shrink-0">
                <button onclick="incrementItem('${item.id}', -1)" class="mc-btn px-2 py-1 text-xs cursor-pointer">-1</button>
                <input type="number" value="${item.have}" min="0" onchange="setItemHave('${item.id}', this.value)"
                  class="w-16 mc-slot px-1.5 py-1 text-center text-xs text-white focus:outline-none" />
                <button onclick="editItemNeed('${item.id}')" title="Modifier le total requis"
                  class="text-xs text-neutral-400 hover:text-white px-1 underline decoration-dotted cursor-pointer">/ ${item.need}</button>
                <button onclick="incrementItem('${item.id}', 1)" class="mc-btn px-2 py-1 text-xs cursor-pointer">+1</button>
                <button onclick="incrementItem('${item.id}', 16)" class="mc-btn px-2 py-1 text-xs cursor-pointer">+16</button>
                <button onclick="incrementItem('${item.id}', 64)" class="mc-btn px-2 py-1 text-xs cursor-pointer">+64</button>
                ${item.need >= 1728 ? `<button onclick="incrementItem('${item.id}', 1728)" title="+1 Shulker Box (1728)" class="mc-btn px-2 py-1 text-xs text-purple-300 cursor-pointer">+1728</button>` : ''}
                <button onclick="completeItem('${item.id}')" title="${dict.fillBtn}" class="mc-btn-green px-2 py-1 text-xs ml-1 cursor-pointer">✓</button>
                <button onclick="removeItem('${item.id}')" class="mc-btn px-2 py-1 text-xs text-neutral-400 hover:text-red-400 cursor-pointer">✕</button>
              </div>
            </div>

            ${isPickerOpen ? `
              <div class="p-2.5 bg-[#141414] border border-[#333] space-y-2">
                <input type="text" value="${escapeHtml(item.name)}" placeholder="${dict.pickerPlaceholder}"
                  oninput="searchIconForItem('${item.id}', this.value)"
                  class="w-full mc-slot px-2.5 py-1.5 text-xs text-white focus:outline-none" />
                <div id="pickerResults_${item.id}" class="flex flex-wrap gap-1.5"></div>
              </div>
            ` : ''}

            <div class="mc-xp-track w-full h-1.5">
              <div class="mc-xp-fill h-full transition-all duration-200" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    render();
    loadMinecraftTextures();
  </script>
