<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans antialiased selection:bg-white selection:text-black">
  <div class="max-w-4xl mx-auto px-4 py-8 sm:py-12 space-y-8">

    <!-- En-tête minimaliste -->
    <header class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 pb-6 border-b border-neutral-800">
      <div>
        <p class="text-xs uppercase tracking-widest text-neutral-500">Suivi de construction</p>
        <h1 id="currentProjectTitle" class="text-2xl font-semibold tracking-tight mt-1">Base Principale</h1>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <select id="projectSelect" class="bg-neutral-900 border border-neutral-800 px-3 py-1.5 text-sm focus:outline-none focus:border-white"></select>
        <button onclick="createNewProject()" class="bg-white text-black hover:bg-neutral-200 text-sm font-medium px-3 py-1.5 transition">+ Projet</button>
        <button onclick="deleteCurrentProject()" class="border border-neutral-800 hover:border-red-500 hover:text-red-400 text-neutral-400 text-sm px-2.5 py-1.5 transition" title="Supprimer le projet">Suppr.</button>
      </div>
    </header>

    <!-- Progression globale & Sauvegarde -->
    <section class="space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs text-neutral-400">
        <span id="globalStatsText">0 / 0 matériaux complétés</span>
        <div class="flex items-center gap-4">
          <button onclick="exportData()" class="hover:text-white underline underline-offset-4 transition">Exporter JSON</button>
          <label class="hover:text-white underline underline-offset-4 transition cursor-pointer">
            Importer JSON
            <input type="file" accept=".json" onchange="importData(event)" class="hidden" />
          </label>
        </div>
      </div>
      <div class="w-full bg-neutral-900 h-1.5">
        <div id="globalProgressBar" class="bg-emerald-500 h-1.5 transition-all duration-300" style="width: 0%"></div>
      </div>
    </section>

    <!-- Import Capture d'écran (OCR) -->
    <section class="border border-neutral-800 bg-neutral-900/40">
      <label id="dropZone" class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 px-4 py-3.5 cursor-pointer hover:bg-neutral-900 transition">
        <span class="text-sm text-neutral-200">Importer une capture d'écran (cliquer, glisser ou <span class="text-neutral-400 font-mono text-xs">Ctrl+V</span>)</span>
        <span class="text-xs uppercase tracking-wider text-neutral-400 border border-neutral-700 px-2.5 py-1 self-start sm:self-auto">Parcourir</span>
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
      </label>

      <!-- Barre de chargement OCR -->
      <div id="ocrStatus" class="hidden px-4 py-3 border-t border-neutral-800 space-y-2">
        <div class="flex justify-between text-xs text-neutral-400">
          <span id="ocrStatusLabel">Analyse de l'image...</span>
          <span id="ocrPercent" class="font-mono">0%</span>
        </div>
        <div class="w-full bg-neutral-800 h-1">
          <div id="ocrProgressBar" class="bg-white h-1 transition-all" style="width: 0%"></div>
        </div>
      </div>

      <!-- Vérification avant ajout -->
      <div id="ocrReviewBox" class="hidden p-4 border-t border-neutral-800 bg-neutral-950 space-y-3">
        <div class="flex items-center justify-between text-xs">
          <span class="uppercase tracking-wider text-neutral-400">Matériaux détectés — vérifier avant validation</span>
          <button onclick="closeOcrReview()" class="text-neutral-500 hover:text-white">Fermer</button>
        </div>
        <div id="ocrParsedList" class="space-y-2 max-h-60 overflow-y-auto"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button onclick="addParsedRow()" class="border border-neutral-800 hover:border-neutral-600 text-xs px-3 py-1.5">+ Ligne</button>
          <button onclick="confirmOcrItems()" class="bg-white text-black hover:bg-neutral-200 text-xs font-medium px-4 py-1.5">Ajouter à la liste</button>
        </div>
      </div>
    </section>

    <!-- Ajout manuel & Liste des matériaux -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs uppercase tracking-widest text-neutral-500">Matériaux requis</h2>
        <label class="inline-flex items-center gap-2 text-xs text-neutral-400 hover:text-neutral-200 cursor-pointer select-none">
          <input type="checkbox" id="hideCompletedCheckbox" onchange="render()" class="accent-white" />
          Masquer terminés
        </label>
      </div>

      <!-- Formulaire d'ajout direct -->
      <form onsubmit="addManualItem(event)" class="grid grid-cols-1 sm:grid-cols-12 border border-neutral-800 bg-neutral-950">
        <input type="text" id="manualName" placeholder="Nom du matériau" required
          class="sm:col-span-6 bg-transparent px-3 py-2 text-sm border-b sm:border-b-0 sm:border-r border-neutral-800 focus:outline-none focus:bg-neutral-900" />
        <input type="number" id="manualHave" placeholder="Stock (0)" min="0"
          class="sm:col-span-2 bg-transparent px-3 py-2 text-sm border-b sm:border-b-0 sm:border-r border-neutral-800 focus:outline-none focus:bg-neutral-900 font-mono" />
        <input type="number" id="manualNeed" placeholder="Requis" min="1" required
          class="sm:col-span-2 bg-transparent px-3 py-2 text-sm border-b sm:border-b-0 sm:border-r border-neutral-800 focus:outline-none focus:bg-neutral-900 font-mono" />
        <button type="submit" class="sm:col-span-2 bg-white text-black hover:bg-neutral-200 text-sm font-medium py-2 transition">Ajouter</button>
      </form>

      <!-- Liste plate séparée par des lignes fines -->
      <div id="materialsList" class="border-t border-neutral-800 divide-y divide-neutral-800"></div>
    </section>

  </div>

  <script>
    const STORAGE_KEY = 'base_builder_projects_v1';

    let state = loadState();
    let parsedOcrItems = [];

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return {
        activeProjectId: 'default',
        projects: [
          {
            id: 'default',
            name: 'Base Principale',
            items: [
              { id: '1', name: 'Bois', have: 150, need: 500 },
              { id: '2', name: 'Pierre', have: 300, need: 300 }
            ]
          }
        ]
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function getActiveProject() {
      return state.projects.find(p => p.id === state.activeProjectId) || state.projects[0];
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // --- Projets ---
    function createNewProject() {
      const name = prompt('Nom du projet :');
      if (!name || !name.trim()) return;
      const id = 'proj_' + Date.now();
      state.projects.push({ id, name: name.trim(), items: [] });
      state.activeProjectId = id;
      saveState();
    }

    function deleteCurrentProject() {
      if (state.projects.length <= 1) {
        alert('Impossible de supprimer le dernier projet.');
        return;
      }
      const proj = getActiveProject();
      if (!confirm(`Supprimer "${proj.name}" ?`)) return;
      state.projects = state.projects.filter(p => p.id !== proj.id);
      state.activeProjectId = state.projects[0].id;
      saveState();
    }

    document.getElementById('projectSelect').addEventListener('change', (e) => {
      state.activeProjectId = e.target.value;
      saveState();
    });

    // --- Matériaux ---
    function addManualItem(e) {
      e.preventDefault();
      const name = document.getElementById('manualName').value.trim();
      const have = parseInt(document.getElementById('manualHave').value, 10) || 0;
      const need = parseInt(document.getElementById('manualNeed').value, 10) || 1;
      if (!name) return;

      upsertMaterial(name, have, need);
      e.target.reset();
      saveState();
    }

    function upsertMaterial(name, have, need) {
      const proj = getActiveProject();
      const existing = proj.items.find(i => i.name.toLowerCase() === name.toLowerCase());
      if (existing) {
        existing.need += need;
        existing.have += have;
      } else {
        proj.items.push({ id: 'item_' + Date.now() + Math.random(), name, have, need });
      }
    }

    function incrementItem(id, delta) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = Math.max(0, item.have + delta);
      saveState();
    }

    function setItemHave(id, value) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = Math.max(0, parseInt(value, 10) || 0);
      saveState();
    }

    function completeItem(id) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = item.need;
      saveState();
    }

    function removeItem(id) {
      const proj = getActiveProject();
      proj.items = proj.items.filter(i => i.id !== id);
      saveState();
    }

    // --- OCR ---
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (file) runOCR(file);
    }

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) runOCR(file);
          break;
        }
      }
    });

    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('bg-neutral-900'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-neutral-900'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('bg-neutral-900');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) runOCR(file);
    });

    async function runOCR(imageFile) {
      const statusBox = document.getElementById('ocrStatus');
      const statusLabel = document.getElementById('ocrStatusLabel');
      const percentLabel = document.getElementById('ocrPercent');
      const progressBar = document.getElementById('ocrProgressBar');

      statusBox.classList.remove('hidden');
      statusLabel.textContent = 'Initialisation OCR...';
      percentLabel.textContent = '0%';
      progressBar.style.width = '0%';

      try {
        const worker = await Tesseract.createWorker(['fra', 'eng'], 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const pct = Math.round(m.progress * 100);
              statusLabel.textContent = 'Lecture en cours...';
              percentLabel.textContent = pct + '%';
              progressBar.style.width = pct + '%';
            }
          }
        });

        const { data: { text } } = await worker.recognize(imageFile);
        await worker.terminate();

        statusBox.classList.add('hidden');
        parsedOcrItems = parseMaterialLines(text);
        if (parsedOcrItems.length === 0) {
          parsedOcrItems = [{ name: '', have: 0, need: 1 }];
        }
        renderOcrReview();
      } catch (err) {
        console.error(err);
        statusLabel.textContent = 'Erreur lors de la lecture.';
      }
    }

    function parseMaterialLines(rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      const results = [];

      for (let line of lines) {
        line = line.replace(/^[\-\*\•\|\[\]\(\)]+\s*/, '');

        let matchFraction = line.match(/^(.*?)\s*(\d+)\s*\/\s*(\d+)\s*(.*)$/);
        if (matchFraction) {
          const name = (matchFraction[1] || matchFraction[4]).replace(/[:\-xX]+$/, '').trim();
          const have = parseInt(matchFraction[2], 10);
          const need = parseInt(matchFraction[3], 10);
          if (name && need > 0) {
            results.push({ name, have, need });
            continue;
          }
        }

        let matchPrefix = line.match(/^[xX×]?\s*(\d+)\s*[xX×]?\s+(.+)$/);
        if (matchPrefix) {
          const need = parseInt(matchPrefix[1], 10);
          const name = matchPrefix[2].trim();
          if (name.length > 1 && need > 0) {
            results.push({ name, have: 0, need });
            continue;
          }
        }

        let matchSuffix = line.match(/^(.+?)\s*(?:[:\-xX×])\s*(\d+)$/) || line.match(/^(.+?)\s+(\d+)$/);
        if (matchSuffix) {
          const name = matchSuffix[1].trim();
          const need = parseInt(matchSuffix[2], 10);
          if (name.length > 1 && need > 0) {
            results.push({ name, have: 0, need });
          }
        }
      }
      return results;
    }

    function renderOcrReview() {
      const box = document.getElementById('ocrReviewBox');
      const list = document.getElementById('ocrParsedList');
      box.classList.remove('hidden');

      list.innerHTML = parsedOcrItems.map((item, idx) => `
        <div class="grid grid-cols-12 gap-2 items-center">
          <input type="text" value="${escapeHtml(item.name)}" placeholder="Matériau"
            onchange="parsedOcrItems[${idx}].name = this.value"
            class="col-span-6 bg-neutral-900 border border-neutral-800 px-2.5 py-1 text-sm focus:outline-none focus:border-white" />
          <input type="number" value="${item.have}" min="0" placeholder="Stock"
            onchange="parsedOcrItems[${idx}].have = parseInt(this.value,10)||0"
            class="col-span-2 bg-neutral-900 border border-neutral-800 px-2 py-1 text-sm font-mono focus:outline-none focus:border-white" />
          <input type="number" value="${item.need}" min="1" placeholder="Requis"
            onchange="parsedOcrItems[${idx}].need = parseInt(this.value,10)||1"
            class="col-span-3 bg-neutral-900 border border-neutral-800 px-2 py-1 text-sm font-mono focus:outline-none focus:border-white" />
          <button onclick="parsedOcrItems.splice(${idx},1); renderOcrReview()" class="col-span-1 text-neutral-500 hover:text-red-400 text-xs">✕</button>
        </div>
      `).join('');
    }

    function addParsedRow() {
      parsedOcrItems.push({ name: '', have: 0, need: 1 });
      renderOcrReview();
    }

    function closeOcrReview() {
      document.getElementById('ocrReviewBox').classList.add('hidden');
      parsedOcrItems = [];
    }

    function confirmOcrItems() {
      for (const item of parsedOcrItems) {
        if (item.name && item.name.trim()) {
          upsertMaterial(item.name.trim(), item.have || 0, item.need || 1);
        }
      }
      closeOcrReview();
      saveState();
    }

    // --- JSON ---
    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'base-materiaux.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (imported && Array.isArray(imported.projects)) {
            state = imported;
            saveState();
          } else {
            alert('Fichier JSON invalide.');
          }
        } catch {
          alert('Impossible de lire ce fichier.');
        }
      };
      reader.readAsText(file);
    }

    // --- Rendu ---
    function render() {
      const select = document.getElementById('projectSelect');
      select.innerHTML = state.projects.map(p =>
        `<option value="${p.id}" ${p.id === state.activeProjectId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`
      ).join('');

      const proj = getActiveProject();
      document.getElementById('currentProjectTitle').textContent = proj.name;

      const totalItems = proj.items.length;
      const doneItems = proj.items.filter(i => i.have >= i.need).length;
      const totalHave = proj.items.reduce((acc, i) => acc + Math.min(i.have, i.need), 0);
      const totalNeed = proj.items.reduce((acc, i) => acc + i.need, 0);
      const globalPct = totalNeed > 0 ? Math.round((totalHave / totalNeed) * 100) : 0;

      document.getElementById('globalStatsText').textContent =
        `${doneItems} / ${totalItems} ressources complètes · ${globalPct}%`;
      document.getElementById('globalProgressBar').style.width = globalPct + '%';

      const hideCompleted = document.getElementById('hideCompletedCheckbox').checked;
      const visibleItems = hideCompleted ? proj.items.filter(i => i.have < i.need) : proj.items;

      const listEl = document.getElementById('materialsList');
      if (visibleItems.length === 0) {
        listEl.innerHTML = `<p class="text-xs text-neutral-600 py-8 text-center">Aucun matériau à afficher.</p>`;
        return;
      }

      listEl.innerHTML = visibleItems.map(item => {
        const isDone = item.have >= item.need;
        const pct = Math.min(100, Math.round((item.have / item.need) * 100));
        const missing = Math.max(0, item.need - item.have);

        return `
          <div class="py-3.5 space-y-2.5 ${isDone ? 'opacity-50' : ''}">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div class="flex items-baseline gap-3">
                <span class="text-sm font-medium ${isDone ? 'line-through text-neutral-400' : 'text-neutral-100'}">${escapeHtml(item.name)}</span>
                <span class="text-xs text-neutral-500 font-mono">${isDone ? 'Complet' : `-${missing}`}</span>
              </div>

              <div class="flex flex-wrap items-center gap-1">
                <button onclick="incrementItem('${item.id}', -1)" class="border border-neutral-800 hover:border-neutral-600 px-2 py-0.5 text-xs font-mono">-1</button>
                <input type="number" value="${item.have}" min="0" onchange="setItemHave('${item.id}', this.value)"
                  class="w-16 bg-neutral-900 border border-neutral-800 px-1.5 py-0.5 text-center text-xs font-mono focus:outline-none focus:border-white" />
                <span class="text-xs text-neutral-500 font-mono px-1">/ ${item.need}</span>
                <button onclick="incrementItem('${item.id}', 1)" class="border border-neutral-800 hover:border-neutral-600 px-2 py-0.5 text-xs font-mono">+1</button>
                <button onclick="incrementItem('${item.id}', 10)" class="border border-neutral-800 hover:border-neutral-600 px-2 py-0.5 text-xs font-mono">+10</button>
                <button onclick="incrementItem('${item.id}', 50)" class="border border-neutral-800 hover:border-neutral-600 px-2 py-0.5 text-xs font-mono">+50</button>
                <button onclick="completeItem('${item.id}')" title="Compléter" class="border border-neutral-800 hover:border-emerald-500 hover:text-emerald-400 px-2 py-0.5 text-xs ml-1">✓</button>
                <button onclick="removeItem('${item.id}')" title="Supprimer" class="text-neutral-600 hover:text-red-400 px-1.5 py-0.5 text-xs">✕</button>
              </div>
            </div>

            <div class="w-full bg-neutral-900 h-0.5">
              <div class="${isDone ? 'bg-emerald-500' : 'bg-white'} h-0.5 transition-all duration-200" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    render();
  </script>
</body>
</html>
