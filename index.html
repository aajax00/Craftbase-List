<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Base Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      border-radius: 0px !important;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #181818;
      background-image:
        linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      font-family: 'JetBrains Mono', monospace;
      color: #f3f3f3;
    }
    .mc-font {
      font-family: 'Silkscreen', monospace;
    }
    .mc-pixel {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .mc-panel {
      background-color: #262626;
      border: 2px solid #0e0e0e;
      box-shadow:
        inset 2px 2px 0px #3d3d3d,
        inset -2px -2px 0px #171717;
    }
    .mc-slot {
      background-color: #161616;
      border-top: 2px solid #0a0a0a;
      border-left: 2px solid #0a0a0a;
      border-right: 2px solid #3b3b3b;
      border-bottom: 2px solid #3b3b3b;
    }
    .mc-slot:hover {
      background-color: #1f1f1f;
    }
    .mc-chest-gui {
      background-color: #c6c6c6;
      border: 3px solid #000000;
      box-shadow:
        inset 3px 3px 0px #ffffff,
        inset -3px -3px 0px #555555;
      color: #3f3f3f;
    }
    .mc-chest-slot {
      background-color: #8b8b8b;
      border-top: 2px solid #373737;
      border-left: 2px solid #373737;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      position: relative;
    }
    .mc-chest-slot:hover {
      background-color: #a6a6a6;
    }
    .mc-stack-num {
      font-family: 'Silkscreen', monospace;
      font-size: 11px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 2px 2px 0px #3f3f3f;
      pointer-events: none;
    }
    .mc-build-cell {
      background-color: #141414;
      border: 1px solid #262626;
      position: relative;
      user-select: none;
    }
    .mc-build-cell:hover {
      outline: 1px solid #80ff20;
      z-index: 5;
    }
    .mc-btn {
      background-color: #3a3a3a;
      color: #f0f0f0;
      border: 2px solid #0e0e0e;
      box-shadow:
        inset 2px 2px 0px #565656,
        inset -2px -2px 0px #222222;
      transition: background-color 0.08s;
    }
    .mc-btn:hover {
      background-color: #4a4a4a;
    }
    .mc-btn:active {
      box-shadow: inset 2px 2px 0px #1e1e1e;
    }
    .mc-btn-green {
      background-color: #3c8527;
      color: #ffffff;
      border: 2px solid #0d1c08;
      box-shadow:
        inset 2px 2px 0px #57ad3e,
        inset -2px -2px 0px #255716;
      text-shadow: 1px 1px 0px #17380e;
    }
    .mc-btn-green:hover {
      background-color: #469c2e;
    }
    .mc-btn-green:active {
      box-shadow: inset 2px 2px 0px #214d14;
    }
    .mc-xp-track {
      background-color: #131f10;
      border: 2px solid #0a0a0a;
    }
    .mc-xp-fill {
      background-color: #80ff20;
      box-shadow: inset 0 -2px 0 #4ba60f;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen w-full selection:bg-[#80ff20] selection:text-black">

  <!-- BARRE SUPÉRIEURE PLEINE LARGEUR -->
  <header class="mc-panel w-full px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-3.5 h-3.5 bg-[#80ff20] border border-black shrink-0"></div>
      <div>
        <h1 id="currentProjectTitle" class="mc-font text-lg sm:text-xl text-white leading-none">Base Principale</h1>
        <p id="globalStatsText" class="text-xs text-neutral-400 mt-1">0 / 0 validés · 0%</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <span id="saveIndicator" class="text-[#80ff20] text-xs mr-2">✓ Sauvegardé</span>

      <select id="projectSelect" class="mc-slot px-3 py-1.5 text-xs sm:text-sm text-white focus:outline-none"></select>
      <button id="btnNewProject" onclick="createNewProject()" class="mc-btn-green mc-font text-xs px-3 py-2 cursor-pointer">+ Projet</button>
      <button id="btnDelProject" onclick="deleteCurrentProject()" class="mc-btn text-xs px-2.5 py-2 text-neutral-300 hover:text-red-400 cursor-pointer">Suppr.</button>

      <!-- Switch FR / EN -->
      <div class="flex border-2 border-[#0e0e0e] ml-1">
        <button id="langBtnFr" onclick="setLanguage('fr')" class="mc-font text-xs px-2.5 py-1.5 cursor-pointer">FR</button>
        <button id="langBtnEn" onclick="setLanguage('en')" class="mc-font text-xs px-2.5 py-1.5 cursor-pointer">EN</button>
      </div>
    </div>
  </header>

  <!-- BARRE D'XP GLOBALE -->
  <div class="mc-xp-track w-full h-3">
    <div id="globalProgressBar" class="mc-xp-fill h-full transition-all duration-300" style="width: 0%"></div>
  </div>

  <!-- CONTENU PRINCIPAL PLEINE PAGE -->
  <main class="flex-1 w-full p-4 sm:p-6 space-y-5">

    <!-- ZONE IMPORT MULTI-CAPTURES & AJOUT RAPIDE -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

      <!-- Import captures d'écran -->
      <section class="lg:col-span-6 mc-panel flex flex-col justify-between">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-4">
          <label id="dropZone" class="flex-1 cursor-pointer">
            <p id="uiDropTitle" class="mc-font text-xs sm:text-sm text-white">Importer des captures d'écran</p>
            <p id="uiDropHint" class="text-xs text-neutral-400 mt-1">1 ou plusieurs images · Glisser-déposer ou Ctrl+V</p>
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden" onchange="handleImageUpload(event)" />
          </label>

          <div class="flex items-center gap-2 shrink-0">
            <select id="columnModeSelect" title="Colonnes sur l'image" class="mc-slot px-2 py-2 text-xs text-neutral-200 focus:outline-none">
              <option value="auto">Auto</option>
              <option value="2">2 Col.</option>
              <option value="1">1 Col.</option>
            </select>
            <button type="button" onclick="openTextImportOnly()" id="uiTextModeBtn" class="mc-btn text-xs px-2.5 py-2 cursor-pointer">Texte</button>
            <label for="imageInput" id="uiBrowseBtn" class="mc-btn-green mc-font text-xs px-3 py-2 cursor-pointer">Images</label>
          </div>
        </div>

        <!-- Progression OCR -->
        <div id="ocrStatus" class="hidden px-4 py-3 border-t-2 border-[#161616] bg-[#1d1d1d] space-y-2">
          <div class="flex justify-between text-xs">
            <span id="ocrStatusLabel" class="text-[#80ff20]">Analyse...</span>
            <span id="ocrPercent" class="text-neutral-300">0%</span>
          </div>
          <div class="mc-xp-track w-full h-2">
            <div id="ocrProgressBar" class="mc-xp-fill h-full transition-all" style="width: 0%"></div>
          </div>
        </div>
      </section>

      <!-- Ajout manuel rapide -->
      <section class="lg:col-span-6 mc-panel p-4 flex flex-col justify-center relative">
        <p id="uiManualTitle" class="mc-font text-xs text-neutral-300 mb-2">Ajouter un bloc / item (calculs autorisés : 3+2, 64*4)</p>
        <form onsubmit="addManualItem(event)" class="grid grid-cols-12 gap-2">
          <div class="col-span-6 flex items-center mc-slot">
            <div id="manualPreviewBox" class="w-9 h-9 flex items-center justify-center border-r border-[#333] shrink-0">
              <span class="text-xs text-neutral-600">?</span>
            </div>
            <input type="text" id="manualName" autocomplete="off" placeholder="Stone, Barrel, Campfire..." required
              oninput="onManualNameInput(this.value)"
              class="w-full bg-transparent px-2.5 py-2 text-xs sm:text-sm text-white focus:outline-none" />
          </div>
          <input type="text" id="manualHave" inputmode="text" placeholder="Stock (3+2)"
            onblur="previewMathInput(this, true)"
            class="col-span-2 mc-slot px-2 py-2 text-xs sm:text-sm text-white focus:outline-none" />
          <input type="text" id="manualNeed" inputmode="text" placeholder="Requis (64*2)" required
            onblur="previewMathInput(this, false)"
            class="col-span-2 mc-slot px-2 py-2 text-xs sm:text-sm text-white focus:outline-none" />
          <button id="uiAddManualBtn" type="submit" class="col-span-2 mc-btn-green mc-font text-xs py-2 cursor-pointer">+</button>
        </form>

        <!-- Autocomplétion textures -->
        <div id="autocompleteDropdown" class="hidden absolute left-4 right-4 top-full z-30 bg-[#181818] border-2 border-[#0e0e0e] divide-y divide-[#282828] max-h-64 overflow-y-auto"></div>
      </section>

    </div>

    <!-- PANNEAU EN 2 ÉTAPES : TEXTE EXTRAIT -> LISTE AVEC ICÔNES -->
    <section id="ocrReviewBox" class="hidden mc-panel p-4 bg-[#1e1e1e] space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b-2 border-[#141414]">
        <div class="flex items-center gap-3">
          <span id="uiReviewTitle" class="mc-font text-xs sm:text-sm text-[#80ff20]">Conversion Image → Texte → Liste</span>
          <span id="ocrCountBadge" class="text-xs text-neutral-400"></span>
        </div>
        <button id="uiCloseReview" onclick="closeOcrReview()" class="text-xs text-neutral-400 hover:text-white underline cursor-pointer">Fermer</button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <!-- ÉTAPE 1 : Texte brut extrait -->
        <div class="lg:col-span-4 flex flex-col space-y-2">
          <div class="flex items-center justify-between">
            <label for="ocrRawTextArea" id="uiStep1Label" class="mc-font text-[11px] text-neutral-300">1. Texte extrait (modifiable)</label>
            <button type="button" onclick="reparseFromTextArea()" id="uiReparseBtn" class="text-[11px] text-[#80ff20] hover:underline cursor-pointer">Actualiser ↻</button>
          </div>
          <textarea id="ocrRawTextArea" rows="12" oninput="reparseFromTextArea()"
            placeholder="Stone : 1509&#10;Barrel : 89"
            class="w-full flex-1 mc-slot p-2.5 text-xs text-neutral-100 font-mono leading-relaxed focus:outline-none resize-y"></textarea>
        </div>

        <!-- ÉTAPE 2 : Liste structurée générée depuis le texte -->
        <div class="lg:col-span-8 flex flex-col space-y-2">
          <div class="flex items-center justify-between">
            <span id="uiStep2Label" class="mc-font text-[11px] text-neutral-300">2. Liste générée</span>
            <button id="uiAddRowBtn" onclick="addParsedRow()" class="mc-btn text-xs px-2.5 py-1 cursor-pointer">+ Ligne</button>
          </div>
          <div id="ocrParsedList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-1"></div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t-2 border-[#141414]">
        <button id="uiConfirmOcrBtn" onclick="confirmOcrItems()" class="mc-btn-green mc-font text-xs px-5 py-2.5 cursor-pointer">Ajouter tout au projet</button>
      </div>
    </section>

    <!-- SECTION PRINCIPALE : LISTE / COFFRES / CONSTRUCTION -->
    <section class="mc-panel p-4 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b-2 border-[#161616]">
        <div class="flex flex-wrap items-center gap-3">
          <!-- Switch Vue Liste / Vue Coffres / Vue Construction -->
          <div class="flex border-2 border-[#0e0e0e]">
            <button id="viewModeListBtn" onclick="setViewMode('list')" class="mc-font text-xs px-3 py-1.5 cursor-pointer">Liste</button>
            <button id="viewModeChestBtn" onclick="setViewMode('chest')" class="mc-font text-xs px-3 py-1.5 cursor-pointer">Coffres</button>
            <button id="viewModeBuildBtn" onclick="setViewMode('build')" class="mc-font text-xs px-3 py-1.5 cursor-pointer">Construction</button>
          </div>

          <span id="catalogStatus" class="text-xs text-neutral-400"></span>
          <button type="button" onclick="refreshAllProjectIcons(true)" title="Recharger les icônes PrismarineJS" class="text-xs text-neutral-400 hover:text-[#80ff20] px-1.5 py-0.5 border border-[#333] cursor-pointer">↻</button>
        </div>

        <!-- Contrôles Vue Liste -->
        <div id="listViewControls" class="flex flex-wrap items-center gap-2">
          <input type="text" id="listSearchInput" oninput="render()" placeholder="Filtrer la liste..."
            class="mc-slot px-2.5 py-1.5 text-xs text-white focus:outline-none w-40 sm:w-52" />

          <div class="flex items-center gap-1 text-xs">
            <button id="filterAll" onclick="setFilter('all')" class="px-3 py-1.5 border border-[#0e0e0e] cursor-pointer">Tous</button>
            <button id="filterTodo" onclick="setFilter('todo')" class="px-3 py-1.5 border border-[#0e0e0e] cursor-pointer">À faire</button>
            <button id="filterDone" onclick="setFilter('done')" class="px-3 py-1.5 border border-[#0e0e0e] cursor-pointer">Validés</button>
          </div>
        </div>

        <!-- Contrôles Vue Coffres -->
        <div id="chestViewControls" class="hidden flex flex-wrap items-center gap-2 text-xs">
          <div class="flex border border-[#0e0e0e]">
            <button id="chestTypeDoubleBtn" onclick="setChestSlots(54)" class="px-2.5 py-1.5 cursor-pointer">Double Coffre (54)</button>
            <button id="chestTypeSingleBtn" onclick="setChestSlots(27)" class="px-2.5 py-1.5 cursor-pointer">Coffre Simple (27)</button>
          </div>

          <select id="chestSourceSelect" onchange="setChestSource(this.value)" class="mc-slot px-2.5 py-1.5 text-xs text-white focus:outline-none">
            <option value="need">Quantité : Total requis</option>
            <option value="have">Quantité : En stock</option>
            <option value="missing">Quantité : Restant à farmer</option>
          </select>
        </div>

        <!-- Contrôles Vue Construction -->
        <div id="buildViewControls" class="hidden flex flex-wrap items-center gap-2 text-xs">
          <label class="flex items-center gap-1.5 text-neutral-300 cursor-pointer select-none px-2 py-1 bg-[#181818] border border-[#0e0e0e]">
            <input type="checkbox" id="onionSkinToggle" onchange="toggleOnionSkin(this.checked)" class="accent-[#80ff20]" />
            <span id="uiOnionSkinLabel">Aperçu couche Y-1</span>
          </label>

          <select id="gridSizeSelect" onchange="changeBlueprintSize(this.value)" class="mc-slot px-2.5 py-1.5 text-xs text-white focus:outline-none">
            <option value="8">Grille 8×8</option>
            <option value="12">Grille 12×12</option>
            <option value="16" selected>Grille 16×16</option>
            <option value="24">Grille 24×24</option>
            <option value="32">Grille 32×32</option>
          </select>
        </div>
      </div>

      <!-- CONTENEUR VUE LISTE -->
      <div id="materialsList" class="grid grid-cols-1 xl:grid-cols-2 gap-3"></div>

      <!-- CONTENEUR VUE COFFRES -->
      <div id="chestViewContainer" class="hidden space-y-4"></div>

      <!-- CONTENEUR VUE CONSTRUCTION (COUCHE PAR COUCHE) -->
      <div id="buildViewContainer" class="hidden space-y-4"></div>
    </section>

  </main>

    function normalizeStr(str) {
      return String(str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

    // =========================================================================
    // ÉVALUATEUR DE CALCULS SÉCURISÉ (EX: "3+2" -> 5, "64*3+12" -> 204)
    // =========================================================================
    function evaluateMathExpr(rawInput, fallback = 0) {
      const str = String(rawInput ?? '')
        .replace(/,/g, '.')
        .replace(/[xX×]/g, '*')
        .replace(/÷/g, '/')
        .replace(/\s+/g, '');

      if (!str) return fallback;
      if (/^\d+$/.test(str)) return parseInt(str, 10);
      if (!/^[0-9+\-*/().]+$/.test(str)) return fallback;

      let pos = 0;

      function parseExpression() {
        let val = parseTerm();
        while (pos < str.length && (str[pos] === '+' || str[pos] === '-')) {
          const op = str[pos++];
          const right = parseTerm();
          val = op === '+' ? val + right : val - right;
        }
        return val;
      }

      function parseTerm() {
        let val = parseFactor();
        while (pos < str.length && (str[pos] === '*' || str[pos] === '/')) {
          const op = str[pos++];
          const right = parseFactor();
          if (op === '*') val *= right;
          else val = right !== 0 ? val / right : val;
        }
        return val;
      }

      function parseFactor() {
        if (str[pos] === '+') {
          pos++;
          return parseFactor();
        }
        if (str[pos] === '-') {
          pos++;
          return -parseFactor();
        }
        if (str[pos] === '(') {
          pos++;
          const val = parseExpression();
          if (str[pos] === ')') pos++;
          return val;
        }
        const start = pos;
        while (pos < str.length && /[0-9.]/.test(str[pos])) pos++;
        if (start === pos) return NaN;
        return parseFloat(str.slice(start, pos));
      }

      const result = parseExpression();
      if (pos !== str.length || !Number.isFinite(result)) return fallback;
      return Math.max(0, Math.round(result));
    }

    function previewMathInput(inputEl, allowZero) {
      const minVal = allowZero ? 0 : 1;
      const evaluated = evaluateMathExpr(inputEl.value, allowZero ? 0 : 1);
      if (inputEl.value.trim() !== '') {
        inputEl.value = Math.max(minVal, evaluated);
      }
    }

    // =========================================================================
    // TAILLE DES STACKS MINECRAFT (64, 16 ou 1)
    // =========================================================================
    function getMinecraftStackSize(itemName) {
      const resolved = resolveMinecraftItem(itemName);
      const id = resolved ? resolved.id : normalizeStr(itemName).replace(/\s+/g, '_');

      const unstackableSuffixes = [
        '_sword', '_pickaxe', '_axe', '_shovel', '_hoe',
        '_helmet', '_chestplate', '_leggings', '_boots',
        '_bed', '_boat', '_chest_boat', '_raft', '_chest_raft',
        '_horse_armor', '_bucket'
      ];
      const unstackableExact = new Set([
        'bow', 'crossbow', 'trident', 'shield', 'fishing_rod',
        'flint_and_steel', 'shears', 'brush', 'spyglass', 'mace',
        'minecart', 'chest_minecart', 'furnace_minecart', 'tnt_minecart', 'hopper_minecart',
        'saddle', 'totem_of_undying', 'elytra', 'enchanted_book',
        'potion', 'splash_potion', 'lingering_potion',
        'cake', 'goat_horn', 'bundle', 'wolf_armor', 'carrot_on_a_stick', 'warped_fungus_on_a_stick'
      ]);

      if (id !== 'bucket' && unstackableSuffixes.some(suf => id.endsWith(suf))) return 1;
      if (unstackableExact.has(id) || id.startsWith('music_disc_') || id.endsWith('shulker_box')) return 1;

      const stack16Exact = new Set([
        'ender_pearl', 'snowball', 'egg', 'blue_egg', 'brown_egg',
        'bucket', 'honey_bottle', 'armor_stand', 'written_book', 'writable_book', 'wind_charge'
      ]);
      if (stack16Exact.has(id) || id.endsWith('_sign') || id.endsWith('_hanging_sign') || id.endsWith('_banner')) {
        return 16;
      }

      return 64;
    }

    // =========================================================================
    // CHARGEMENT UNIQUE : PRISMARINEJS MINECRAFT-ASSETS (1.21.4)
    // =========================================================================
    function minecraftEditDistance(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;

      const canon = (s) => s
        .replace(/rt/g, 'rr')
        .replace(/rn/g, 'm')
        .replace(/cl/g, 'd')
        .replace(/vv/g, 'w');

      const ca = canon(a);
      const cb = canon(b);
      if (ca === cb) return 0.25;

      const matrix = Array.from({ length: cb.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= ca.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= cb.length; i++) {
        for (let j = 1; j <= ca.length; j++) {
          const chA = ca[j - 1];
          const chB = cb[i - 1];
          let cost = chA === chB ? 0 : 1;
          if (cost === 1) {
            const pair = chA + chB;
            if (['hw', 'wh', 'li', 'il', 'lt', 'tl', 'eo', 'oe', 'oc', 'co'].includes(pair)) {
              cost = 0.4;
            }
          }
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }
      return matrix[cb.length][ca.length];
    }

    function refreshAllProjectIcons(forceOverwrite = false) {
      if (!mcCatalog.length) return;
      let updated = false;
      for (const proj of state.projects) {
        for (const item of proj.items) {
          const isOldWebisso = item.iconUrl && item.iconUrl.includes('webisso.github.io');
          if (forceOverwrite || isOldWebisso || !item.iconUrl) {
            const match = resolveMinecraftItem(item.name);
            if (match) {
              item.iconUrl = match.iconUrl;
              item.fallbackUrl = match.fallbackUrl || '';
              updated = true;
            }
          }
        }
      }
      if (updated) saveState();
      else render();
    }

    async function loadMinecraftTextures() {
      catalogState = 'loading';
      render();

      const catalogMap = new Map();

      try {
        const [itemsRes, blocksRes] = await Promise.all([
          fetch(`${PRISMARINE_CDN}/items_textures.json`),
          fetch(`${PRISMARINE_CDN}/blocks_textures.json`)
        ]);

        const registerEntries = (payload, defaultFolder) => {
          if (!payload) return;
          // PrismarineJS minecraft-assets utilise un tableau [{ name, texture }]
          const list = Array.isArray(payload)
            ? payload
            : Object.entries(payload).map(([name, val]) =>
                typeof val === 'string' ? { name, texture: val } : { name, ...val }
              );

          for (const entry of list) {
            if (!entry || !entry.name || !entry.texture) continue;
            const cleanId = String(entry.name).replace(/^minecraft:/, '').trim();
            if (!cleanId) continue;

            // entry.texture est par ex. "blocks/stone" ou "items/water_bucket"
            const texPath = String(entry.texture)
              .replace(/^minecraft:/, '')
              .replace(/^block\//, 'blocks/')
              .replace(/^item\//, 'items/');

            const iconUrl = `${PRISMARINE_CDN}/${texPath}.png`;
            const fallbackUrl = `${PRISMARINE_CDN}/${defaultFolder}/${cleanId}.png`;
            const readable = cleanId.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            catalogMap.set(cleanId, {
              id: cleanId,
              readable,
              normReadable: normalizeStr(readable),
              category: defaultFolder,
              iconUrl,
              fallbackUrl: fallbackUrl !== iconUrl ? fallbackUrl : ''
            });
          }
        };

        if (itemsRes.ok) registerEntries(await itemsRes.json(), 'items');
        if (blocksRes.ok) registerEntries(await blocksRes.json(), 'blocks');
      } catch (err) {
        console.error('PrismarineJS load error:', err);
      }

      mcCatalog = Array.from(catalogMap.values());
      mcCatalogById = {};
      for (const item of mcCatalog) {
        mcCatalogById[item.id] = item;
      }

      catalogState = mcCatalog.length > 0 ? 'loaded' : 'offline';
      refreshAllProjectIcons(true);
    }

    function resolveMinecraftItem(rawName) {
      if (!mcCatalog.length || !rawName) return null;
      const norm = normalizeStr(rawName);
      if (!norm) return null;

      // 1. Alias FR ou abrégés exacts (ex: "stripped spruce" -> "stripped_spruce_wood")
      if (FR_AND_SHORT_ALIASES[norm] && mcCatalogById[FR_AND_SHORT_ALIASES[norm]]) {
        return mcCatalogById[FR_AND_SHORT_ALIASES[norm]];
      }

      // 2. Correspondance exacte ID ou nom lisible (ex: "stone" -> "stone", "stone_bricks" -> "stone_bricks")
      const asId = norm.replace(/\s+/g, '_');
      if (mcCatalogById[asId]) return mcCatalogById[asId];

      const exactReadable = mcCatalog.find(i => i.normReadable === norm);
      if (exactReadable) return exactReadable;

      // 3. Préfixe exact (ex: "polished andesi" -> "polished_andesite", "stripped spruce" -> "stripped_spruce_log")
      if (norm.length >= 6) {
        const prefixMatches = mcCatalog.filter(i => i.normReadable.startsWith(norm + ' ') || i.normReadable.startsWith(norm));
        if (prefixMatches.length > 0) {
          prefixMatches.sort((a, b) => a.normReadable.length - b.normReadable.length);
          return prefixMatches[0];
        }
      }

      // 4. Correction fautes de frappe OCR (même nombre de mots uniquement, évite les faux positifs)
      const inputWords = norm.split(' ');
      if (norm.length >= 4) {
        let bestMatch = null;
        let bestDist = norm.length >= 10 ? 2.2 : 1.3;

        for (const item of mcCatalog) {
          const itemWords = item.normReadable.split(' ');
          if (itemWords.length !== inputWords.length) continue;
          if (Math.abs(item.normReadable.length - norm.length) > 2) continue;

          const d = minecraftEditDistance(norm, item.normReadable);
          if (d <= bestDist) {
            bestDist = d;
            bestMatch = item;
            if (d === 0) break;
          }
        }
        if (bestMatch) return bestMatch;
      }

      return null;
    }

    function searchMinecraftCatalog(query, limit = 30) {
      const norm = normalizeStr(query);
      if (!norm || !mcCatalog.length) return [];

      const results = [];
      const seen = new Set();

      for (const [aliasKey, mcId] of Object.entries(FR_AND_SHORT_ALIASES)) {
        if (aliasKey.includes(norm) && mcCatalogById[mcId] && !seen.has(mcId)) {
          seen.add(mcId);
          results.push(mcCatalogById[mcId]);
          if (results.length >= limit) return results;
        }
      }

      const asId = norm.replace(/\s+/g, '_');
      for (const item of mcCatalog) {
        if (seen.has(item.id)) continue;
        if (item.normReadable.includes(norm) || item.id.includes(asId)) {
          seen.add(item.id);
          results.push(item);
          if (results.length >= limit) break;
        }
      }
      return results;
    }

    function handleIconError(imgEl) {
      const fb1 = imgEl.dataset.fb1;
      if (imgEl.dataset.step === '0' && fb1 && imgEl.src !== fb1) {
        imgEl.dataset.step = '1';
        imgEl.src = fb1;
        return;
      }
      const span = document.createElement('span');
      span.className = 'text-xs text-neutral-600';
      span.textContent = '?';
      imgEl.replaceWith(span);
    }

    function renderIconImg(iconUrl, fallbackUrl = '', sizeClass = 'w-8 h-8', extraClass = '') {
      if (!iconUrl && !fallbackUrl) {
        return `<span class="text-xs text-neutral-600">?</span>`;
      }
      const primary = iconUrl || fallbackUrl;
      return `<img src="${escapeHtml(primary)}"
        data-step="0"
        data-fb1="${escapeHtml(fallbackUrl || '')}"
        alt=""
        loading="lazy"
        draggable="false"
        class="${sizeClass} ${extraClass} mc-pixel object-contain pointer-events-none"
        onerror="handleIconError(this)" />`;
    }

    function loadState() {
      const keysToTry = [STORAGE_KEY, 'mc_base_tracker_v11', 'mc_base_tracker_v10', 'mc_base_tracker_v9'];
      for (const key of keysToTry) {
        const saved = localStorage.getItem(key);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (!parsed.lang) parsed.lang = 'fr';
            return parsed;
          } catch {}
        }
      }
      return {
        lang: 'fr',
        activeProjectId: 'default',
        projects: [{ id: 'default', name: 'Base Principale', items: [] }]
      };
    }

      return String(str).replace(/[&<>"']/g, m => ({

      }[m]));

    // --- Matériaux ---
    function addManualItem(e) {
      e.preventDefault();
      const name = document.getElementById('manualName').value.trim();
      const have = evaluateMathExpr(document.getElementById('manualHave').value, 0);
      const need = Math.max(1, evaluateMathExpr(document.getElementById('manualNeed').value, 1));
      if (!name) return;

      const resolved = selectedManualMatch || resolveMinecraftItem(name);
      upsertMaterial(name, have, need, resolved?.iconUrl || '', resolved?.fallbackUrl || '');

      e.target.reset();
      selectedManualMatch = null;
      document.getElementById('manualPreviewBox').innerHTML = `<span class="text-xs text-neutral-600">?</span>`;
      document.getElementById('autocompleteDropdown').classList.add('hidden');
      saveState();
    }

    function upsertMaterial(name, have, need, iconUrl = '', fallbackUrl = '') {
      const proj = getActiveProject();
      const existing = proj.items.find(i => normalizeStr(i.name) === normalizeStr(name));
      if (existing) {
        existing.need += need;
        existing.have += have;
        if (!existing.iconUrl && iconUrl) {
          existing.iconUrl = iconUrl;
          existing.fallbackUrl = fallbackUrl;
        }
      } else {
        const autoMatch = iconUrl ? { iconUrl, fallbackUrl } : resolveMinecraftItem(name);
        proj.items.push({
          id: 'item_' + Date.now() + Math.random().toString(36).slice(2, 6),
          name: autoMatch?.readable || name,
          have,
          need,
          iconUrl: autoMatch?.iconUrl || '',
          fallbackUrl: autoMatch?.fallbackUrl || ''
        });
      }
    }

    function incrementItem(id, delta) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = Math.max(0, item.have + delta);
      saveState();
    }

    function commitItemHaveExpr(id, rawValue) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      const evaluated = evaluateMathExpr(rawValue, item.have);
      item.have = Math.max(0, evaluated);
      saveState();
    }

    function handleHaveKeyDown(e, id) {
      if (e.key === 'Enter') {
        e.preventDefault();
        commitItemHaveExpr(id, e.target.value);
      }
    }

    function editItemNeed(id) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      const val = prompt(`${item.name} — Requis (ex: 64*4) :`, item.need);
      if (val === null) return;
      const parsed = evaluateMathExpr(val, 0);
      if (parsed > 0) {
        item.need = parsed;
        saveState();
      }
    }

    function completeItem(id) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === id);
      if (!item) return;
      item.have = item.need;
      saveState();
    }

    function removeItem(id) {
      const proj = getActiveProject();
      proj.items = proj.items.filter(i => i.id !== id);
      // Nettoyer aussi du plan de construction si supprimé
      if (proj.blueprint?.layers) {
        for (const layer of proj.blueprint.layers) {
          for (const [coord, itemId] of Object.entries(layer.cells)) {
            if (itemId === id) delete layer.cells[coord];
          }
        }
      }
      saveState();
    }

    function toggleIconPicker(id) {
      activeIconPickerId = activeIconPickerId === id ? null : id;
      render();
      if (activeIconPickerId) {
        const proj = getActiveProject();
        const item = proj.items.find(i => i.id === activeIconPickerId);
        if (item) searchIconForItem(activeIconPickerId, item.name);
      }
    }

    function searchIconForItem(itemId, query) {
      const container = document.getElementById(`pickerResults_${itemId}`);
      if (!container) return;
      const results = searchMinecraftCatalog(query, 30);
      container.innerHTML = results.map(r => `
        <button type="button" onclick="applyIconToItemById('${itemId}', '${escapeHtml(r.id)}')"
          title="${escapeHtml(r.readable)}"
          class="w-9 h-9 mc-slot flex items-center justify-center cursor-pointer">
          ${renderIconImg(r.iconUrl, r.fallbackUrl, 'w-6 h-6')}
        </button>
      `).join('');
    }

    function applyIconToItemById(itemId, catalogId) {
      const proj = getActiveProject();
      const item = proj.items.find(i => i.id === itemId);
      const entry = mcCatalogById[catalogId];
      if (item && entry) {
        item.iconUrl = entry.iconUrl;
        item.fallbackUrl = entry.fallbackUrl;
      }
      activeIconPickerId = null;
      saveState();
    }

    // =========================================================================
    // VUE CONSTRUCTION : PLAN COUCHE PAR COUCHE AVEC LE STOCK DISPONIBLE
    // =========================================================================
    function getUsedBlueprintCounts(proj) {
      const used = {};
      for (const layer of proj.blueprint.layers) {
        for (const itemId of Object.values(layer.cells)) {
          used[itemId] = (used[itemId] || 0) + 1;
        }
      }
      return used;
    }

    function selectBuildBrush(itemId) {
      selectedBuildItemId = itemId;
      render();
    }

    function toggleOnionSkin(checked) {
      const proj = getActiveProject();
      proj.blueprint.showOnionSkin = checked;
      saveState();
    }

    function changeBlueprintSize(newSizeVal) {
      const proj = getActiveProject();
      const newSize = parseInt(newSizeVal, 10) || 16;
      proj.blueprint.size = newSize;
      // Nettoyer les cellules hors limites si réduit
      for (const layer of proj.blueprint.layers) {
        for (const key of Object.keys(layer.cells)) {
          const [x, y] = key.split(',').map(Number);
          if (x >= newSize || y >= newSize) delete layer.cells[key];
        }
      }
      saveState();
    }

    function setActiveLayer(idx) {
      const proj = getActiveProject();
      proj.blueprint.activeLayerIndex = Math.max(0, Math.min(proj.blueprint.layers.length - 1, idx));
      saveState();
    }

    function addBlueprintLayer() {
      const proj = getActiveProject();
      proj.blueprint.layers.push({ cells: {} });
      proj.blueprint.activeLayerIndex = proj.blueprint.layers.length - 1;
      saveState();
    }

    function duplicateBlueprintLayer() {
      const proj = getActiveProject();
      const bp = proj.blueprint;
      const srcLayer = bp.layers[bp.activeLayerIndex];
      const used = getUsedBlueprintCounts(proj);
      const itemMap = Object.fromEntries(proj.items.map(i => [i.id, i]));

      const newCells = {};
      for (const [coord, itemId] of Object.entries(srcLayer.cells)) {
        const item = itemMap[itemId];
        if (!item) continue;
        const alreadyUsed = used[itemId] || 0;
        if (alreadyUsed < item.have) {
          newCells[coord] = itemId;
          used[itemId] = alreadyUsed + 1;
        }
      }

      bp.layers.splice(bp.activeLayerIndex + 1, 0, { cells: newCells });
      bp.activeLayerIndex += 1;
      saveState();
    }

    function clearCurrentBlueprintLayer() {
      const proj = getActiveProject();
      const bp = proj.blueprint;
      if (Object.keys(bp.layers[bp.activeLayerIndex].cells).length === 0) return;
      if (!confirm(t().confirmClearLayer)) return;
      bp.layers[bp.activeLayerIndex].cells = {};
      saveState();
    }

    function deleteCurrentBlueprintLayer() {
      const proj = getActiveProject();
      const bp = proj.blueprint;
      if (bp.layers.length <= 1) return;
      bp.layers.splice(bp.activeLayerIndex, 1);
      bp.activeLayerIndex = Math.max(0, bp.activeLayerIndex - 1);
      saveState();
    }

    function applyCellPaint(x, y, forceErase = false) {
      const proj = getActiveProject();
      const bp = proj.blueprint;
      const layer = bp.layers[bp.activeLayerIndex];
      const key = `${x},${y}`;

      if (forceErase || selectedBuildItemId === '__eraser__') {
        if (layer.cells[key]) {
          delete layer.cells[key];
          saveState();
        }
        return;
      }

      if (!selectedBuildItemId) return;

      // Si on clique sur une case qui a déjà exactement ce bloc (en clic simple), on l'efface
      if (layer.cells[key] === selectedBuildItemId && !isPaintingGrid) {
        delete layer.cells[key];
        saveState();
        return;
      }

      // Vérifier le stock disponible
      const targetItem = proj.items.find(i => i.id === selectedBuildItemId);
      if (!targetItem || targetItem.have <= 0) return;

      const used = getUsedBlueprintCounts(proj);
      const currentCellItem = layer.cells[key];
      const effectiveUsed = (used[selectedBuildItemId] || 0) - (currentCellItem === selectedBuildItemId ? 1 : 0);

      if (effectiveUsed >= targetItem.have) {
        return; // Stock épuisé pour ce bloc
      }

      if (layer.cells[key] !== selectedBuildItemId) {
        layer.cells[key] = selectedBuildItemId;
        saveState();
      }
    }

    function onGridCellMouseDown(e, x, y) {
      e.preventDefault();
      if (e.button === 2) {
        isPaintingGrid = true;
        paintActionMode = 'erase';
        applyCellPaint(x, y, true);
        return;
      }
      if (e.button === 0) {
        const proj = getActiveProject();
        const layer = proj.blueprint.layers[proj.blueprint.activeLayerIndex];
        const key = `${x},${y}`;

        // Alt+clic = pipette
        if (e.altKey && layer.cells[key]) {
          selectBuildBrush(layer.cells[key]);
          return;
        }

        if (selectedBuildItemId === '__eraser__' || layer.cells[key] === selectedBuildItemId) {
          paintActionMode = 'erase';
          applyCellPaint(x, y, true);
        } else {
          paintActionMode = 'place';
          applyCellPaint(x, y, false);
        }
        isPaintingGrid = true;
      }
    }

    function onGridCellMouseEnter(x, y) {
      if (!isPaintingGrid) return;
      applyCellPaint(x, y, paintActionMode === 'erase');
    }

    window.addEventListener('mouseup', () => {
      isPaintingGrid = false;
    });

    // =========================================================================
    // VUE COFFRES (AVEC GESTION DES STACKS 64 / 16 / 1)
    // =========================================================================
    function buildChestsAllocation(items, slotsPerChest, qtyMode) {
      const slots = [];

      for (const item of items) {
        let qty = 0;
        if (qtyMode === 'need') qty = item.need;
        else if (qtyMode === 'have') qty = item.have;
        else if (qtyMode === 'missing') qty = Math.max(0, item.need - item.have);

        if (qty <= 0) continue;

        const stackSize = getMinecraftStackSize(item.name);
        let remaining = qty;
        let stackIndex = 1;
        const totalStacksForItem = Math.ceil(qty / stackSize);

        while (remaining > 0) {
          const countInSlot = Math.min(stackSize, remaining);
          slots.push({
            name: item.name,
            count: countInSlot,
            stackSize,
            totalQty: qty,
            stackIndex,
            totalStacksForItem,
            iconUrl: item.iconUrl,
            fallbackUrl: item.fallbackUrl
          });
          remaining -= countInSlot;
          stackIndex++;
        }
      }

      const chests = [];
      for (let i = 0; i < slots.length; i += slotsPerChest) {
        chests.push(slots.slice(i, i + slotsPerChest));
      }
      return { chests, totalOccupiedSlots: slots.length };
    }

    // OCR SPÉCIALISÉ MINECRAFT
    // =========================================================================
    function prepareCleanWhiteBgCanvas(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);

          const origW = img.width;
          const origH = img.height;

          const rawCanvas = document.createElement('canvas');
          rawCanvas.width = origW;
          rawCanvas.height = origH;
          const rawCtx = rawCanvas.getContext('2d');
          rawCtx.drawImage(img, 0, 0);

          const imgData = rawCtx.getImageData(0, 0, origW, origH);
          const data = imgData.data;

          let sumLum = 0;
          for (let i = 0; i < data.length; i += 16) {
            sumLum += 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          }
          const isDarkTheme = (sumLum / (data.length / 16)) < 140;

          for (let i = 0; i < data.length; i += 4) {
            const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            let out;
            if (isDarkTheme) {
              if (lum <= 140) out = 255;
              else if (lum >= 205) out = 0;
              else out = Math.round(255 - ((lum - 140) / 65) * 255);
            } else {
              if (lum >= 180) out = 255;
              else if (lum <= 105) out = 0;
              else out = Math.round(((lum - 105) / 75) * 255);
            }
            data[i] = data[i + 1] = data[i + 2] = out;
            data[i + 3] = 255;
          }
          rawCtx.putImageData(imgData, 0, 0);

          const scale = origW < 1300 ? 3 : 2;
          const scaledCanvas = document.createElement('canvas');
          scaledCanvas.width = origW * scale;
          scaledCanvas.height = origH * scale;
          const sCtx = scaledCanvas.getContext('2d');
          sCtx.imageSmoothingEnabled = true;
          sCtx.imageSmoothingQuality = 'high';
          sCtx.drawImage(rawCanvas, 0, 0, scaledCanvas.width, scaledCanvas.height);

          resolve(scaledCanvas);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        img.src = url;
      });
    }

    function cropCanvasRect(src, x0, y0, x1, y1, pad = 6) {
      const sx = Math.max(0, Math.floor(x0));
      const sy = Math.max(0, Math.floor(y0));
      const sw = Math.max(1, Math.min(src.width - sx, Math.ceil(x1 - sx)));
      const sh = Math.max(1, Math.min(src.height - sy, Math.ceil(y1 - sy)));

      const out = document.createElement('canvas');
      out.width = sw + pad * 2;
      out.height = sh + pad * 2;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(src, sx, sy, sw, sh, pad, pad, sw, sh);
      return out;
    }

    function splitCanvasIntoColumns(canvas) {
      const mode = document.getElementById('columnModeSelect').value;
      const w = canvas.width;
      const h = canvas.height;

      if (mode === '1') return [canvas];
      if (mode === '2') {
        return [
          cropCanvasRect(canvas, 0, 0, w / 2, h, 0),
          cropCanvasRect(canvas, w / 2, 0, w, h, 0)
        ];
      }

      const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
      const yStart = Math.floor(h * 0.04);
      const yEnd = Math.floor(h * 0.96);

      const darkInCol = (x) => {
        let count = 0;
        for (let y = yStart; y < yEnd; y += 2) {
          if (data[(y * w + x) * 4] < 160) count++;
        }
        return count;
      };

      let leftDark = 0;
      for (let x = Math.floor(w * 0.14); x < Math.floor(w * 0.36); x += 4) leftDark += darkInCol(x);
      let rightDark = 0;
      for (let x = Math.floor(w * 0.64); x < Math.floor(w * 0.86); x += 4) rightDark += darkInCol(x);

      if (leftDark < 30 || rightDark < 30) return [canvas];

      let bestStart = -1, bestLen = 0, currStart = -1, currLen = 0;
      for (let x = Math.floor(w * 0.43); x <= Math.floor(w * 0.57); x++) {
        if (darkInCol(x) === 0) {
          if (currStart === -1) currStart = x;
          currLen++;
          if (currLen > bestLen) {
            bestLen = currLen;
            bestStart = currStart;
          }
        } else {
          currStart = -1;
          currLen = 0;
        }
      }

      if (bestLen >= 6) {
        const midX = bestStart + Math.floor(bestLen / 2);
        return [
          cropCanvasRect(canvas, 0, 0, midX, h, 0),
          cropCanvasRect(canvas, midX, 0, w, h, 0)
        ];
      }
      return [canvas];
    }

    function analyzeColumnLayout(colCanvas) {
      const w = colCanvas.width;
      const h = colCanvas.height;
      const data = colCanvas.getContext('2d').getImageData(0, 0, w, h).data;

      const iconCutoffX = Math.floor(w * 0.125);
      const colProj = new Int32Array(w);
      for (let y = 0; y < h; y++) {
        for (let x = iconCutoffX; x < w; x++) {
          if (data[(y * w + x) * 4] < 165) colProj[x]++;
        }
      }

      let splitNumX = -1;
      let bestGapLen = 0;
      let currGapStart = -1;
      let currGapLen = 0;

      for (let x = Math.floor(w * 0.58); x <= Math.floor(w * 0.86); x++) {
        if (colProj[x] <= 1) {
          if (currGapStart === -1) currGapStart = x;
          currGapLen++;
          if (currGapLen > bestGapLen) {
            bestGapLen = currGapLen;
            splitNumX = currGapStart + Math.floor(currGapLen / 2);
          }
        } else {
          currGapStart = -1;
          currGapLen = 0;
        }
      }

      let hasRightNumbers = false;
      if (splitNumX !== -1 && bestGapLen >= Math.max(8, Math.floor(w * 0.025))) {
        let rightInk = 0;
        for (let x = splitNumX + 2; x < w - 4; x++) rightInk += colProj[x];
        if (rightInk > 25) hasRightNumbers = true;
      }

      const rowProj = new Int32Array(h);
      for (let y = 0; y < h; y++) {
        let ink = 0;
        for (let x = iconCutoffX; x < w; x++) {
          if (data[(y * w + x) * 4] < 165) ink++;
        }
        rowProj[y] = ink;
      }

      const rows = [];
      let inRow = false;
      let rStart = 0;
      for (let y = 0; y < h; y++) {
        if (rowProj[y] >= 4) {
          if (!inRow) {
            inRow = true;
            rStart = y;
          }
        } else if (inRow) {
          if (y - rStart >= 8) {
            rows.push({ y0: rStart, y1: y });
          }
          inRow = false;
        }
      }
      if (inRow && h - rStart >= 8) rows.push({ y0: rStart, y1: h });

      return { iconCutoffX, splitNumX: hasRightNumbers ? splitNumX : -1, rows };
    }

    function fixMinecraftOcrTypos(name) {
      return name
        .replace(/\bHood\b/gi, 'Wood')
        .replace(/\bHall\b/gi, 'Wall')
        .replace(/\bStab\b/gi, 'Slab')
        .replace(/\bBartel\b/gi, 'Barrel')
        .replace(/\bCamplire\b/gi, 'Campfire')
        .replace(/\b0ak\b/gi, 'Oak')
        .replace(/\b1og\b/gi, 'Log')
        .replace(/\b1ron\b/gi, 'Iron')
        .replace(/\b8rick/gi, 'Brick')
        .replace(/\bFurnaco\b/gi, 'Furnace')
        .replace(/\bStalrs\b/gi, 'Stairs')
        .replace(/\bTrapd00r\b/gi, 'Trapdoor')
        .replace(/\bP0lished\b/gi, 'Polished')
        .replace(/\bAndeslte\b/gi, 'Andesite')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function cleanItemLabel(raw) {
      let cleaned = String(raw || '')
        .replace(/^[^a-zA-ZÀ-ÿ]+/, '')
        .replace(/[^a-zA-ZÀ-ÿ)]+$/, '')
        .replace(/\s+/g, ' ')
        .trim();

      cleaned = cleaned.replace(/^[a-zA-Z]{1,2}\s+(?=[A-ZÀ-Ý])/, '').trim();
      if (!/[a-zA-ZÀ-ÿ]{3,}/.test(cleaned)) return '';

      cleaned = fixMinecraftOcrTypos(cleaned);
      const match = resolveMinecraftItem(cleaned);
      return match ? match.readable : cleaned;
    }

    function parseTextBlockToItems(text) {
      const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
      const results = [];

      for (let line of lines) {
        line = line.replace(/^[^a-zA-ZÀ-ÿ0-9]+/, '').trim();
        if (!line || !/[a-zA-ZÀ-ÿ]{3,}/.test(line)) continue;

        if (/^(item|material|total|missing|available|materiau|requis|manquant)\b/i.test(line) && !/\d/.test(line)) {
          continue;
        }

        const fracMatch = line.match(/^(.+?)\s*(?:[:\-])?\s*(\d+)\s*\/\s*(\d+)$/);
        if (fracMatch) {
          const name = cleanItemLabel(fracMatch[1]);
          const have = parseInt(fracMatch[2], 10);
          const need = parseInt(fracMatch[3], 10);
          if (name && need > 0) {
            const match = resolveMinecraftItem(name);
            results.push({ name, have, need, iconUrl: match?.iconUrl || '', fallbackUrl: match?.fallbackUrl || '' });
            continue;
          }
        }

        const prefixMatch = line.match(/^[xX×]?\s*(\d+)\s*[xX×]?\s+([a-zA-ZÀ-ÿ].+)$/);
        if (prefixMatch) {
          const need = parseInt(prefixMatch[1], 10);
          const name = cleanItemLabel(prefixMatch[2]);
          if (name && need > 0) {
            const match = resolveMinecraftItem(name);
            results.push({ name, have: 0, need, iconUrl: match?.iconUrl || '', fallbackUrl: match?.fallbackUrl || '' });
            continue;
          }
        }

        const tokens = line.split(/\s+/);
        if (tokens.length >= 2) {
          const lastToken = tokens[tokens.length - 1].replace(/^[xX×:]+/, '');
          if (/^\d+$/.test(lastToken)) {
            const need = parseInt(lastToken, 10);
            const rawName = tokens.slice(0, -1).join(' ').replace(/[:\-xX×]+$/, '').trim();
            const name = cleanItemLabel(rawName);
            if (name && need > 0) {
              const match = resolveMinecraftItem(name);
              results.push({ name, have: 0, need, iconUrl: match?.iconUrl || '', fallbackUrl: match?.fallbackUrl || '' });
              continue;
            }
          }
        }
      }

      return results;
    }

    function reparseFromTextArea() {
      const rawText = document.getElementById('ocrRawTextArea').value;
      const extracted = parseTextBlockToItems(rawText);

      const merged = new Map();
      for (const item of extracted) {
        const key = normalizeStr(item.name);
        if (merged.has(key)) {
          const prev = merged.get(key);
          prev.have += item.have;
          prev.need += item.need;
        } else {
          merged.set(key, { ...item });
        }
      }
      parsedOcrItems = Array.from(merged.values());
      renderOcrReview();
    }

    async function runBatchOCR(imageFiles) {
      const statusBox = document.getElementById('ocrStatus');
      const statusLabel = document.getElementById('ocrStatusLabel');
      const percentLabel = document.getElementById('ocrPercent');
      const progressBar = document.getElementById('ocrProgressBar');

      statusBox.classList.remove('hidden');
      statusLabel.textContent = t().ocrInit;
      percentLabel.textContent = '0%';
      progressBar.style.width = '0%';

      const totalFiles = imageFiles.length;

      try {
        const worker = await Tesseract.createWorker(['eng', 'fra'], 1);
        const allCleanTextLines = [];

        for (let fIdx = 0; fIdx < totalFiles; fIdx++) {
          const cleanCanvas = await prepareCleanWhiteBgCanvas(imageFiles[fIdx]);
          if (!cleanCanvas) continue;

          const columns = splitCanvasIntoColumns(cleanCanvas);

          for (let cIdx = 0; cIdx < columns.length; cIdx++) {
            const col = columns[cIdx];
            const layout = analyzeColumnLayout(col);

            if (layout.splitNumX !== -1 && layout.rows.length > 0) {
              for (let rIdx = 0; rIdx < layout.rows.length; rIdx++) {
                const row = layout.rows[rIdx];
                const padY = Math.max(4, Math.round((row.y1 - row.y0) * 0.25));
                const y0 = row.y0 - padY;
                const y1 = row.y1 + padY;

                const nameCrop = cropCanvasRect(col, layout.iconCutoffX, y0, layout.splitNumX, y1, 8);
                await worker.setParameters({
                  tessedit_pageseg_mode: '7',
                  tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀ-ÿ '-"
                });
                const nameRes = await worker.recognize(nameCrop);
                const cleanName = cleanItemLabel(nameRes.data.text);

                const numCrop = cropCanvasRect(col, layout.splitNumX, y0, col.width, y1, 8);
                await worker.setParameters({
                  tessedit_pageseg_mode: '7',
                  tessedit_char_whitelist: '0123456789/'
                });
                const numRes = await worker.recognize(numCrop);
                const numStr = (numRes.data.text || '').replace(/\s+/g, '').trim();

                if (cleanName && numStr) {
                  allCleanTextLines.push(`${cleanName} : ${numStr}`);
                }

                const stepPct = Math.round(((rIdx + 1) / layout.rows.length) * 100);
                const overallPct = Math.round(((fIdx + (cIdx + (rIdx + 1) / layout.rows.length) / columns.length) / totalFiles) * 100);
                statusLabel.textContent = t().ocrScanning(fIdx + 1, totalFiles, stepPct);
                percentLabel.textContent = overallPct + '%';
                progressBar.style.width = overallPct + '%';
              }
            } else {
              await worker.setParameters({
                tessedit_pageseg_mode: '6',
                tessedit_char_whitelist: ''
              });
              const { data: { text } } = await worker.recognize(col);
              const items = parseTextBlockToItems(text);
              for (const it of items) {
                allCleanTextLines.push(it.have > 0 ? `${it.name} : ${it.have}/${it.need}` : `${it.name} : ${it.need}`);
              }
            }
          }
        }

        await worker.terminate();
        statusBox.classList.add('hidden');

        const area = document.getElementById('ocrRawTextArea');
        area.value = allCleanTextLines.join('\n');
        document.getElementById('ocrReviewBox').classList.remove('hidden');
        reparseFromTextArea();
      } catch (err) {
        console.error(err);
        statusLabel.textContent = t().ocrError;
      }
    }

    // --- Formatage Stacks & Shulkers ---
    function formatStacks(missing, stackSize = 64) {
      if (stackSize === 1 || missing < stackSize) return `${missing}`;
      const shulkerCap = stackSize * 27;
      const shulkers = Math.floor(missing / shulkerCap);
      const remAfterShulker = missing % shulkerCap;
      const stacks = Math.floor(remAfterShulker / stackSize);
      const rest = remAfterShulker % stackSize;

      const parts = [];
      if (shulkers > 0) parts.push(`${shulkers} shulker${shulkers > 1 ? 's' : ''}`);
      if (stacks > 0) parts.push(`${stacks}×${stackSize}`);
      if (rest > 0) parts.push(`${rest}`);
      return `${missing} (${parts.join(' + ')})`;
    }

                <button onclick="incrementItem('${item.id}', 64)" class="mc-btn px-2 py-1 text-xs cursor-pointer">+64</button>
                ${item.need >= 1728 ? `<button onclick="incrementItem('${item.id}', 1728)" title="+1 Shulker Box (1728)" class="mc-btn px-2 py-1 text-xs text-purple-300 cursor-pointer">+1728</button>` : ''}
                <button onclick="completeItem('${item.id}')" title="${dict.fillBtn}" class="mc-btn-green px-2 py-1 text-xs ml-1 cursor-pointer">✓</button>
                <button onclick="removeItem('${item.id}')" class="mc-btn px-2 py-1 text-xs text-neutral-400 hover:text-red-400 cursor-pointer">✕</button>
              </div>
            </div>

            ${isPickerOpen ? `
              <div class="p-2.5 bg-[#141414] border border-[#333] space-y-2">
                <input type="text" value="${escapeHtml(item.name)}" placeholder="${dict.pickerPlaceholder}"
                  oninput="searchIconForItem('${item.id}', this.value)"
                  class="w-full mc-slot px-2.5 py-1.5 text-xs text-white focus:outline-none" />
                <div id="pickerResults_${item.id}" class="flex flex-wrap gap-1.5"></div>
              </div>
            ` : ''}

            <div class="mc-xp-track w-full h-1.5">
              <div class="mc-xp-fill h-full transition-all duration-200" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    render();
    loadMinecraftTextures();
  </script>
</body>
</html>
